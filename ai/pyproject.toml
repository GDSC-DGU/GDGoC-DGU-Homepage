[project]
name = "gdgoc-ai"
version = "0.1.0"
description = "GDGoC DGU 지원서 채점 AI 서비스"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.162.5",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
