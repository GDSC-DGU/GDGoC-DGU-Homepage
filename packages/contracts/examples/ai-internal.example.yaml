# ======================================================================================
# 이 파일은 api와 ai 사이의 내부 계약을 작성하는 방식을 보여 주는 예시입니다.
# 실제 계약은 packages/contracts/ai-internal.yaml 입니다. 이 파일은 실제 계약이 아닙니다.
#
# 누가 쓰나요?
# - Homepage-BE와 Homepage-AI가 읽고 씁니다. (실제 계약의 승인: BE 1명 + AI 1명)
# - 계약이란 "어떤 주소로 무엇을 보내면 무엇이 돌아오는지"를 적어 둔 약속 문서입니다.
#
# 어떻게 쓰나요?
# - 필요한 부분을 복사해서 packages/contracts/ai-internal.yaml 에 붙여 넣고 값을 바꿉니다.
# - 이 파일의 값은 모두 예시입니다. 실제 개인정보, 키, 루브릭이 아닙니다.
#
# 이 파일이 보여 주는 규칙
# - api와 ai 사이의 내부 전용 계약입니다. 브라우저는 호출하지 않습니다.
# - operationId는 노션 API ID와 같게 씁니다. (예: API-AI-001)
# - 인증은 Google이 서명한 ID 토큰(type: http, scheme: bearer)입니다.
# - 재사용하는 구조는 components/schemas에 두고, 오류 응답은 공통 Error 스키마(code, message)를
#   씁니다.
# - 채점 루브릭과 프롬프트 본문은 요청, 응답, 이 레포 어디에도 두지 않습니다.
#   ai가 Secret Manager에서 읽습니다.
#
# 읽는 순서 (위에서 아래로)
# - openapi    : 이 문서가 따르는 OpenAPI 규격의 버전
# - info       : 문서 이름, 버전, 설명
# - servers    : API가 있는 기본 주소
# - tags       : 엔드포인트를 묶는 분류 이름표
# - security   : (이 파일에는 전체 공통 설정이 없고, 엔드포인트마다 적습니다)
# - paths      : 엔드포인트 목록. 주소 -> HTTP 메서드 -> 요청 -> 응답 순서로 적습니다
# - components : 여러 곳에서 다시 쓰는 부품 (인증 방식, 오류 응답, 데이터 구조)
# ======================================================================================

# openapi: 이 문서가 따르는 OpenAPI 규격의 버전입니다. 필수입니다.
# 우리 프로젝트는 3.0.3을 씁니다. 바꾸지 않습니다.
openapi: 3.0.3

# info: 이 API 문서 자체에 대한 정보입니다. 필수입니다. (title, version은 필수)
info:
  # title: 문서 이름입니다. 필수입니다. 문서 도구 화면의 제목으로 쓰입니다.
  title: GDGoC DGU Homepage AI Internal API (예시)
  # version: 이 "API 문서"의 버전입니다. 필수입니다. (OpenAPI 규격 버전과 다릅니다)
  version: 0.0.0
  # description: 문서 설명입니다. 선택입니다.
  description: api가 ai를 호출할 때 쓰는 내부 계약의 예시입니다.

# servers: API를 호출할 기본 주소 목록입니다. 선택입니다.
# 여기서는 / 입니다. 주소 앞에 붙는 경로가 없고, paths의 주소를 그대로 씁니다.
# 호출하는 쪽은 api입니다. 브라우저가 아닙니다.
servers:
  # url: 기본 주소입니다. 필수입니다.
  - url: /
    # description: 이 주소가 무엇인지 설명합니다. 선택입니다.
    description: ai 서비스 (api에서만 접근)

# tags: 엔드포인트를 묶는 분류 이름표 목록입니다. 선택입니다.
# 문서 도구에서 같은 tag끼리 모아서 보여 줍니다.
tags:
  # name: 분류 이름입니다. 필수입니다. 엔드포인트의 tags 값과 글자가 같아야 합니다.
  - name: Grading
    # description: 분류 설명입니다. 선택입니다.
    description: 지원서 채점

# paths: 엔드포인트(API 주소) 목록입니다. 필수입니다.
# 구조: 주소(/grading) -> HTTP 메서드(post) -> 요청과 응답 설명
paths:
  # 주소 /grading : 지원서 채점을 요청하는 주소입니다.
  /grading:
    # post: HTTP 메서드입니다. 보통 "새로 만들기, 처리 요청"에 씁니다.
    # 메서드 아래에 적는 항목을 "operation(오퍼레이션)"이라고 부릅니다.
    # 흐름: 지원자가 지원서를 제출 -> api가 답변을 모아 이 API로 보냄 -> ai가 기준별 점수를 돌려줌.
    post:
      # operationId: 이 오퍼레이션의 고유 이름입니다. 선택이지만 우리 팀은 반드시 적습니다.
      # 노션 API ID와 같게 씁니다. 형식: API-영역-번호 (예: API-AI-001)
      operationId: API-AI-001
      # tags: 위 tags에 만든 분류 이름을 적습니다. 대괄호 []는 목록입니다.
      tags: [Grading]
      # summary: 한 줄 요약입니다. 선택입니다. 문서 도구의 목록에 제목처럼 보입니다.
      summary: 지원서 채점
      # description: 자세한 설명입니다. 선택입니다.
      # `|` 는 여러 줄 글을 줄바꿈 그대로 쓴다는 YAML 표시입니다.
      description: |
        호출 주체: backend (내부 호출 전용)
        지원서 답변을 받아 기준별 점수를 돌려줍니다.
        채점 루브릭은 ai가 Secret Manager에서 읽으며, 요청에 담기지 않고 이 레포에도 두지 않습니다.
      # security: 이 오퍼레이션을 호출할 때 필요한 인증 방식입니다. 선택입니다.
      # googleIdToken은 아래 components/securitySchemes에 정의한 이름입니다.
      # 뒤의 [] 는 OAuth용 권한 범위(scope) 자리이며, 토큰 인증은 쓰지 않으므로 비워 둡니다.
      security:
        - googleIdToken: []
      # requestBody: 요청 본문(body)입니다. 호출하는 쪽(backend)이 보내는 데이터입니다. 선택입니다.
      requestBody:
        # required: 본문을 반드시 보내야 하는지 정합니다. true면 필수, 생략하면 선택입니다.
        required: true
        # content: 본문의 형식(미디어 타입)별 내용입니다.
        content:
          # application/json: 본문을 JSON 형식으로 보낸다는 뜻입니다.
          application/json:
            # schema: 본문이 어떤 모양의 데이터인지 적습니다.
            schema:
              # $ref: 다른 곳에 적어 둔 정의를 가져다 씁니다. (참조)
              # '#/components/schemas/이름' 은 "이 파일의 components > schemas > 이름"을 뜻합니다.
              $ref: '#/components/schemas/GradingRequest'
      # responses: 서버(ai)가 돌려줄 수 있는 응답 목록입니다. 필수입니다.
      # 키는 HTTP 상태 코드입니다. 숫자 앞뒤에 따옴표를 붙입니다. ('200')
      responses:
        # 200: 성공입니다. 본문에 기준별 점수가 들어 있습니다.
        '200':
          # description: 이 응답이 언제 오는지 설명합니다. 응답마다 필수입니다.
          description: 기준별 점수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradingResult'
        # 401: ID 토큰이 없거나 올바르지 않습니다.
        '401':
          description: ID 토큰이 없거나 올바르지 않음
          content:
            application/json:
              schema:
                # 오류 응답은 공통 Error 스키마(code, message)를 씁니다.
                $ref: '#/components/schemas/Error'
        # 422: 요청 본문의 형식이 계약과 다릅니다. (필수 필드 없음, 종류가 다름 등)
        # api는 보내는 본문을 고쳐야 합니다. 같은 요청을 다시 보내도 같은 결과가 나옵니다.
        '422':
          description: 요청 형식이 올바르지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

# components: 여러 곳에서 다시 쓰는 부품을 모아 두는 곳입니다. 선택입니다.
# 여기에 적은 것은 그 자체로는 아무 API도 만들지 않습니다.
# 위쪽에서 $ref로 가져다 쓸 때 비로소 사용됩니다.
components:
  # securitySchemes: 인증 방식을 정의하는 곳입니다.
  # 여기서 정한 이름(googleIdToken)을 오퍼레이션의 security에서 가져다 씁니다.
  securitySchemes:
    # googleIdToken: 이 인증 방식의 이름입니다. 우리가 정한 이름입니다.
    googleIdToken:
      # type: 인증 종류입니다. 필수입니다.
      # http는 HTTP 표준 인증 방식을 쓴다는 뜻입니다.
      type: http
      # scheme: HTTP 인증 방식의 이름입니다. bearer는 "Authorization 헤더에 토큰을 담아 보낸다"는
      # 뜻입니다. 형태: Authorization: Bearer <토큰>
      scheme: bearer
      # bearerFormat: 토큰의 형식을 알려 주는 힌트입니다. 선택입니다. 검증에는 쓰이지 않습니다.
      # JWT는 서명이 들어 있는 토큰 형식입니다.
      bearerFormat: JWT
      description: api가 Google 서비스 계정으로 발급받은 ID 토큰. Authorization 헤더에 Bearer로 보냅니다.
  # schemas: 데이터의 구조(필드 이름, 종류, 필수 여부)를 정의하는 곳입니다.
  # 요청 본문과 응답 본문의 모양을 여기에 적고 $ref로 가져다 씁니다.
  schemas:
    # Error: 오류 응답의 공통 구조입니다. 모든 오류 응답이 이 모양을 씁니다.
    Error:
      # type: 데이터 종류입니다. object는 {이름: 값} 묶음(JSON 객체)입니다.
      # 그 밖의 종류: string(글자), integer(정수), number(소수 포함 숫자), boolean(참/거짓),
      # array(목록)
      type: object
      # required: 반드시 들어 있어야 하는 필드 이름 목록입니다.
      # 여기에 없는 필드는 선택(없어도 됨)입니다.
      required: [code, message]
      # properties: object가 가진 필드 목록입니다. 필드 이름 -> 필드 정의 순서로 적습니다.
      properties:
        code:
          type: string
          # example: 이 필드에 들어갈 값의 예시입니다. 선택입니다.
          # 문서 도구에 그대로 표시됩니다. 검증에는 쓰이지 않습니다.
          example: INVALID_REQUEST
        message:
          type: string
          example: 요청 형식이 올바르지 않습니다.
    # Answer: 지원서 질문 하나에 대한 답변 구조입니다.
    Answer:
      type: object
      # 두 필드 모두 필수입니다.
      required: [questionId, text]
      properties:
        # questionId: 어느 질문에 대한 답변인지 구분하는 식별자입니다.
        questionId:
          type: string
          example: q1
        text:
          type: string
          description: 지원자가 쓴 답변 텍스트
          example: 예시 답변입니다.
    # GradingRequest: 채점 요청 본문의 구조입니다. 지원서 ID와 답변 목록입니다.
    GradingRequest:
      type: object
      required: [applicationId, answers]
      properties:
        # applicationId: 어느 지원서인지 구분하는 식별자입니다.
        applicationId:
          type: string
          example: app-0001
        # answers: 답변 목록입니다.
        answers:
          # array: 같은 모양의 값이 여러 개 모인 목록입니다.
          type: array
          # items: 목록 안 값 하나의 모양입니다. 여기서는 Answer 구조입니다.
          items:
            $ref: '#/components/schemas/Answer'
    # CriterionScore: 채점 기준 하나에 대한 점수 구조입니다.
    CriterionScore:
      type: object
      required: [criterionId, score]
      properties:
        criterionId:
          type: string
          description: 채점 기준 식별자
          example: c1
        # score: 점수입니다. number는 3.5처럼 소수도 쓸 수 있는 숫자입니다.
        score:
          type: number
          example: 3.5
    # GradingResult: 채점 응답 본문의 구조입니다. 지원서 ID와 기준별 점수 목록입니다.
    GradingResult:
      type: object
      required: [applicationId, scores]
      properties:
        applicationId:
          type: string
          example: app-0001
        # scores: 기준별 점수 목록입니다.
        scores:
          type: array
          items:
            $ref: '#/components/schemas/CriterionScore'
