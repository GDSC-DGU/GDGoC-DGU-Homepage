# ======================================================================================
# 이 파일은 frontend와 backend 사이의 계약을 작성하는 방식을 보여 주는 예시입니다.
# 실제 계약은 packages/contracts/openapi.yaml 입니다. 이 파일은 실제 계약이 아닙니다.
#
# 누가 쓰나요?
# - Homepage-FE와 Homepage-BE가 읽고 씁니다. (실제 계약의 승인: FE 1명 + BE 1명)
# - 계약이란 "어떤 주소로 무엇을 보내면 무엇이 돌아오는지"를 적어 둔 약속 문서입니다.
#
# 어떻게 쓰나요?
# - 필요한 부분을 복사해서 packages/contracts/openapi.yaml 에 붙여 넣고 값을 바꿉니다.
# - 이 파일의 값(이름, 이메일, ID 등)은 모두 예시입니다. 실제 개인정보, 키가 아닙니다.
#
# 이 파일이 보여 주는 규칙
# - operationId는 노션 API ID와 같게 씁니다. (예: API-AUTH-001)
# - 엔드포인트마다 tags를 붙입니다.
# - 재사용하는 구조는 components/schemas에 두고 $ref로 참조합니다.
# - 오류 응답은 공통 Error 스키마(code, message)를 씁니다.
# - 로그인이 필요한 엔드포인트는 세션 쿠키 인증(securitySchemes, type: apiKey, in: cookie)을
#   적용합니다.
# - 로그인 없이 호출하는 엔드포인트는 security: []로 명시합니다.
# - 필요한 권한(비회원 / General / Core / Lead)은 description에 적습니다.
# - servers는 상대 경로 /api를 씁니다.
#
# 읽는 순서 (위에서 아래로)
# - openapi    : 이 문서가 따르는 OpenAPI 규격의 버전
# - info       : 문서 이름, 버전, 설명
# - servers    : API가 있는 기본 주소
# - tags       : 엔드포인트를 묶는 분류 이름표
# - security   : (이 파일에는 전체 공통 설정이 없고, 엔드포인트마다 적습니다)
# - paths      : 엔드포인트 목록. 주소 -> HTTP 메서드 -> 요청 -> 응답 순서로 적습니다
# - components : 여러 곳에서 다시 쓰는 부품 (인증 방식, 파라미터, 오류 응답, 데이터 구조)
# ======================================================================================

# openapi: 이 문서가 따르는 OpenAPI 규격의 버전입니다. 필수입니다.
# 우리 프로젝트는 3.0.3을 씁니다. 바꾸지 않습니다.
openapi: 3.0.3

# info: 이 API 문서 자체에 대한 정보입니다. 필수입니다. (title, version은 필수)
info:
  # title: 문서 이름입니다. 필수입니다. 문서 도구 화면의 제목으로 쓰입니다.
  title: GDGoC DGU Homepage API (예시)
  # version: 이 "API 문서"의 버전입니다. 필수입니다. (OpenAPI 규격 버전과 다릅니다)
  version: 0.0.0
  # description: 문서 설명입니다. 선택입니다.
  description: frontend와 backend 사이의 계약을 어떻게 쓰는지 보여 주는 예시입니다.

# servers: API를 호출할 기본 주소 목록입니다. 선택입니다.
# 우리 프로젝트는 상대 경로 /api를 씁니다.
# 상대 경로는 "지금 보고 있는 사이트와 같은 주소 뒤에 /api를 붙인다"는 뜻입니다.
servers:
  # url: 기본 주소입니다. 필수입니다. 아래 paths의 주소 앞에 이 값이 붙습니다.
  # 예: /auth/session -> /api/auth/session
  - url: /api
    # description: 이 주소가 무엇인지 설명합니다. 선택입니다.
    description: 같은 출처의 상대 경로

# tags: 엔드포인트를 묶는 분류 이름표 목록입니다. 선택입니다.
# 문서 도구에서 같은 tag끼리 모아서 보여 줍니다.
# 엔드포인트마다 아래 이름 중 하나를 tags에 적습니다.
tags:
  # name: 분류 이름입니다. 필수입니다. 엔드포인트의 tags 값과 글자가 같아야 합니다.
  - name: Auth
    # description: 분류 설명입니다. 선택입니다.
    description: 로그인 세션
  - name: Member
    description: 회원
  - name: Team
    description: Teams 게시판

# paths: 엔드포인트(API 주소) 목록입니다. 필수입니다.
# 구조: 주소(/auth/session) -> HTTP 메서드(post, get, delete) -> 요청과 응답 설명
# 주소는 servers의 url 뒤에 붙습니다.
paths:
  # 주소 /auth/session : 로그인 세션을 다루는 주소입니다.
  # 같은 주소에 HTTP 메서드를 여러 개 둘 수 있습니다. (아래는 post와 delete)
  /auth/session:
    # post: HTTP 메서드입니다. 보통 "새로 만들기"에 씁니다. 여기서는 세션(로그인 상태)을 만듭니다.
    # 메서드 아래에 적는 항목을 "operation(오퍼레이션)"이라고 부릅니다.
    # 흐름: 사용자가 구글로 로그인 -> web이 Firebase ID 토큰을 받음 -> 이 API로 토큰을 보냄
    #       -> api가 토큰을 확인하고 세션 쿠키를 내려줌.
    post:
      # operationId: 이 오퍼레이션의 고유 이름입니다. 선택이지만 우리 팀은 반드시 적습니다.
      # 노션 API ID와 같게 씁니다. 형식: API-영역-번호 (예: API-AUTH-001)
      # 문서 전체에서 같은 값이 두 번 나오면 안 됩니다.
      operationId: API-AUTH-001
      # tags: 위 tags에 만든 분류 이름을 적습니다. 대괄호 []는 목록입니다.
      # 우리 팀은 엔드포인트마다 반드시 적습니다.
      tags: [Auth]
      # summary: 한 줄 요약입니다. 선택입니다. 문서 도구의 목록에 제목처럼 보입니다.
      summary: 세션 생성 (로그인)
      # description: 자세한 설명입니다. 선택입니다. 우리 팀은 첫 줄에 "필요 권한"을 적습니다.
      # 권한 종류: 비회원 / General / Core / Lead
      # `|` 는 여러 줄 글을 줄바꿈 그대로 쓴다는 YAML 표시입니다.
      description: |
        필요 권한: 비회원
        Firebase ID 토큰을 검증하고 HttpOnly 세션 쿠키를 발급합니다.
      # security: 이 오퍼레이션을 호출할 때 필요한 인증 방식입니다. 선택입니다.
      # 빈 목록 []은 "로그인 없이 호출 가능"이라는 뜻입니다. (로그인 전이라 쿠키가 없기 때문입니다)
      # 우리 팀은 로그인 없이 호출하는 엔드포인트에 security: []를 꼭 적습니다.
      security: []
      # requestBody: 요청 본문(body)입니다. 클라이언트가 서버에 보내는 데이터입니다. 선택입니다.
      # post, put, patch에서 주로 씁니다. get, delete는 보통 쓰지 않습니다.
      requestBody:
        # required: 본문을 반드시 보내야 하는지 정합니다. true면 필수, 생략하면 선택입니다.
        required: true
        # content: 본문의 형식(미디어 타입)별 내용입니다.
        content:
          # application/json: 본문을 JSON 형식으로 보낸다는 뜻입니다.
          application/json:
            # schema: 본문이 어떤 모양의 데이터인지 적습니다.
            schema:
              # $ref: 다른 곳에 적어 둔 정의를 가져다 씁니다. (참조)
              # '#/components/schemas/이름' 은 "이 파일의 components > schemas > 이름"을 뜻합니다.
              # 같은 구조를 여러 번 쓸 때 한 번만 적고 $ref로 가져옵니다.
              $ref: '#/components/schemas/SessionCreateRequest'
      # responses: 서버가 돌려줄 수 있는 응답 목록입니다. 필수입니다.
      # 키는 HTTP 상태 코드입니다. 숫자 앞뒤에 따옴표를 붙입니다. ('204')
      responses:
        # 204: 성공했고, 돌려줄 본문이 없다는 뜻입니다.
        # 호출한 쪽(frontend)은 로그인에 성공한 것으로 봅니다.
        '204':
          # description: 이 응답이 언제 오는지 설명합니다. 응답마다 필수입니다.
          description: 세션 생성 성공. 응답 본문은 없고 Set-Cookie 헤더로 세션 쿠키를 내려줍니다.
          # headers: 응답 헤더 목록입니다. 선택입니다. 헤더는 본문 말고 따로 오는 부가 정보입니다.
          headers:
            # Set-Cookie: 서버가 브라우저에 쿠키를 저장하라고 알리는 헤더입니다.
            # 쿠키 이름은 __session 입니다. HttpOnly라서 JavaScript에서는 읽을 수 없습니다.
            Set-Cookie:
              description: HttpOnly 세션 쿠키 (__session)
              # schema.type: 값의 종류입니다. string은 글자(문자열)입니다.
              schema:
                type: string
        # 401: 인증 실패입니다. ID 토큰이 없거나 올바르지 않습니다.
        # 호출한 쪽은 로그인에 실패한 것으로 봅니다.
        # 응답 내용은 components/responses/Unauthorized에 한 번만 적고 $ref로 가져옵니다.
        '401':
          $ref: '#/components/responses/Unauthorized'
    # delete: HTTP 메서드입니다. 보통 "지우기"에 씁니다. 여기서는 세션(로그인 상태)을 지웁니다.
    # 흐름: 사용자가 로그아웃 버튼을 누름 -> web이 이 API를 호출 -> api가 세션 쿠키를 만료시킴.
    delete:
      operationId: API-AUTH-002
      tags: [Auth]
      summary: 세션 삭제 (로그아웃)
      description: |
        필요 권한: General 이상
        세션 쿠키를 만료시킵니다.
      # security: 로그인이 필요한 엔드포인트는 사용할 인증 방식의 이름을 적습니다.
      # sessionCookie는 아래 components/securitySchemes에 정의한 이름입니다.
      # 뒤의 [] 는 OAuth용 권한 범위(scope) 자리이며, 쿠키 인증은 쓰지 않으므로 비워 둡니다.
      security:
        - sessionCookie: []
      responses:
        # 204: 로그아웃 성공. 본문은 없습니다.
        '204':
          description: 로그아웃 성공
        # 401: 세션 쿠키가 없거나 만료되었습니다. (이미 로그아웃된 상태)
        '401':
          $ref: '#/components/responses/Unauthorized'
  # 주소 /me : 지금 로그인한 회원 본인을 가리키는 주소입니다.
  /me:
    # get: HTTP 메서드입니다. 보통 "읽기(조회)"에 씁니다. 서버의 데이터를 바꾸지 않습니다.
    # 흐름: 페이지가 열릴 때 web이 호출 -> 로그인한 회원의 이름, 권한 등을 받아 화면에 표시.
    get:
      operationId: API-MEMBER-001
      tags: [Member]
      summary: 내 정보 조회
      description: |
        필요 권한: General 이상
        로그인한 회원의 정보를 돌려줍니다.
      security:
        - sessionCookie: []
      responses:
        # 200: 성공입니다. 본문에 요청한 데이터가 들어 있습니다.
        '200':
          description: 현재 회원
          content:
            application/json:
              schema:
                # 응답 본문이 Member 구조라는 뜻입니다. Member는 components/schemas에 있습니다.
                $ref: '#/components/schemas/Member'
        # 401: 로그인하지 않았거나 세션이 만료되었습니다.
        '401':
          $ref: '#/components/responses/Unauthorized'
  # 주소 /teams/posts : Teams 게시판의 게시글 모음입니다.
  /teams/posts:
    # 흐름: Teams 게시판 화면을 열면 web이 호출 -> 게시글을 페이지 단위로 받아 목록으로 표시.
    get:
      operationId: API-TEAM-001
      tags: [Team]
      summary: Teams 게시글 목록 조회
      description: |
        필요 권한: General 이상
        게시글을 페이지 단위로 돌려줍니다.
      security:
        - sessionCookie: []
      # parameters: 요청 주소에 붙는 값 목록입니다. 선택입니다.
      # 위치는 query(주소 뒤 ?page=0&size=20), path(주소 중간 /{id}), header, cookie 중 하나입니다.
      # 여기서는 components/parameters에 정의한 Page, Size를 $ref로 가져옵니다.
      # 예: GET /api/teams/posts?page=0&size=20
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        # 200: 성공. 게시글 목록과 페이지 정보를 받습니다.
        '200':
          description: 게시글 목록과 페이지 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPostPage'
        # 401: 로그인하지 않았거나 세션이 만료되었습니다.
        '401':
          $ref: '#/components/responses/Unauthorized'

# components: 여러 곳에서 다시 쓰는 부품을 모아 두는 곳입니다. 선택입니다.
# 여기에 적은 것은 그 자체로는 아무 API도 만들지 않습니다.
# 위쪽에서 $ref로 가져다 쓸 때 비로소 사용됩니다.
components:
  # securitySchemes: 인증 방식을 정의하는 곳입니다.
  # 여기서 정한 이름(sessionCookie)을 오퍼레이션의 security에서 가져다 씁니다.
  securitySchemes:
    # sessionCookie: 이 인증 방식의 이름입니다. 우리가 정한 이름입니다.
    sessionCookie:
      # type: 인증 종류입니다. 필수입니다.
      # apiKey는 "정해진 위치에 키 값을 담아 보내는 방식"입니다.
      type: apiKey
      # in: 키 값을 담는 위치입니다. cookie는 쿠키입니다. (header, query도 가능)
      in: cookie
      # name: 쿠키 이름입니다. 우리 프로젝트는 __session 입니다.
      name: __session
      description: api가 발급한 HttpOnly 세션 쿠키
  # parameters: 여러 엔드포인트가 같이 쓰는 요청 파라미터를 정의하는 곳입니다.
  parameters:
    # Page: 파라미터 부품의 이름입니다. $ref에서 이 이름으로 부릅니다.
    Page:
      # name: 실제 주소에 쓰이는 파라미터 이름입니다. 필수입니다. (?page=0)
      name: page
      # in: 파라미터 위치입니다. 필수입니다. query는 주소 뒤 ? 부분입니다.
      in: query
      description: 페이지 번호 (0부터 시작)
      # schema: 값의 모양입니다.
      schema:
        # type: 값의 종류입니다. integer는 정수입니다.
        type: integer
        # minimum: 가장 작은 값입니다. 0보다 작으면 잘못된 요청입니다.
        minimum: 0
        # default: 값을 보내지 않았을 때 서버가 쓰는 기본값입니다.
        # query 파라미터는 required를 생략하면 선택입니다.
        default: 0
    Size:
      name: size
      in: query
      description: 한 페이지의 항목 수
      schema:
        type: integer
        minimum: 1
        # maximum: 가장 큰 값입니다. 100보다 크면 잘못된 요청입니다.
        maximum: 100
        default: 20
  # responses: 여러 엔드포인트가 같이 쓰는 응답을 정의하는 곳입니다.
  # 오퍼레이션의 responses에서 $ref로 가져다 씁니다.
  responses:
    # Unauthorized: 401 응답 부품입니다. 인증되지 않았을 때 모든 엔드포인트가 같은 모양으로 답합니다.
    Unauthorized:
      description: 인증되지 않음
      content:
        application/json:
          schema:
            # 오류 응답은 공통 Error 스키마(code, message)를 씁니다.
            $ref: '#/components/schemas/Error'
          # example: 실제 응답이 어떤 모습인지 보여 주는 예시 값입니다. 선택입니다.
          # 문서 도구에 그대로 표시됩니다. 검증에는 쓰이지 않습니다.
          example:
            code: UNAUTHORIZED
            message: 로그인이 필요합니다.
  # schemas: 데이터의 구조(필드 이름, 종류, 필수 여부)를 정의하는 곳입니다.
  # 요청 본문과 응답 본문의 모양을 여기에 적고 $ref로 가져다 씁니다.
  schemas:
    # Error: 오류 응답의 공통 구조입니다. 모든 오류 응답이 이 모양을 씁니다.
    Error:
      # type: 데이터 종류입니다. object는 {이름: 값} 묶음(JSON 객체)입니다.
      # 그 밖의 종류: string(글자), integer(정수), number(소수 포함 숫자), boolean(참/거짓),
      # array(목록)
      type: object
      # required: 반드시 들어 있어야 하는 필드 이름 목록입니다.
      # 여기에 없는 필드는 선택(없어도 됨)입니다.
      required: [code, message]
      # properties: object가 가진 필드 목록입니다. 필드 이름 -> 필드 정의 순서로 적습니다.
      properties:
        code:
          type: string
          description: 오류 코드
          # example: 이 필드에 들어갈 값의 예시입니다. 선택입니다.
          example: UNAUTHORIZED
        message:
          type: string
          description: 사용자에게 보여줄 수 있는 설명. 개인정보를 담지 않습니다.
          example: 로그인이 필요합니다.
    # SessionCreateRequest: 로그인(세션 생성) 요청 본문의 구조입니다.
    SessionCreateRequest:
      type: object
      # idToken이 필수입니다. 없으면 잘못된 요청입니다.
      required: [idToken]
      properties:
        idToken:
          type: string
          description: Firebase Auth가 발급한 ID 토큰
    # Member: 회원 한 명의 정보 구조입니다. /me 응답에서 씁니다.
    Member:
      type: object
      # 네 필드 모두 필수입니다.
      required: [id, name, email, role]
      properties:
        id:
          type: string
          example: member-0001
        name:
          type: string
          example: 홍길동
        email:
          type: string
          # format: type을 더 구체적으로 정하는 표시입니다. 선택입니다.
          # email은 이메일 주소 모양이라는 뜻입니다. (date-time은 아래에서 설명합니다)
          format: email
          example: member@example.com
        role:
          type: string
          # enum: 쓸 수 있는 값을 정해진 목록으로 제한합니다. 목록에 없는 값은 잘못된 값입니다.
          # 여기서는 회원 권한을 GENERAL, CORE, LEAD 셋 중 하나로 제한합니다.
          enum: [GENERAL, CORE, LEAD]
    # TeamPost: Teams 게시글 한 개의 구조입니다.
    TeamPost:
      type: object
      required: [id, title, authorId, createdAt]
      properties:
        id:
          type: string
          example: post-0001
        title:
          type: string
          example: 예시 게시글 제목
        authorId:
          type: string
          example: member-0001
        createdAt:
          type: string
          # date-time: 날짜와 시각 형식입니다. (예: 2026-01-31T09:00:00Z)
          format: date-time
    # PageInfo: 목록의 페이지 정보 구조입니다.
    PageInfo:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        # page: 지금 페이지 번호입니다. (0부터 시작)
        page:
          type: integer
        # size: 한 페이지의 항목 수입니다.
        size:
          type: integer
        # totalElements: 전체 항목 수입니다.
        totalElements:
          type: integer
        # totalPages: 전체 페이지 수입니다.
        totalPages:
          type: integer
    # TeamPostPage: 게시글 목록 응답의 구조입니다. 게시글 목록(items)과 페이지 정보(pageInfo)입니다.
    TeamPostPage:
      type: object
      required: [items, pageInfo]
      properties:
        # items: 게시글 목록입니다.
        items:
          # array: 같은 모양의 값이 여러 개 모인 목록입니다.
          type: array
          # items: 목록 안 값 하나의 모양입니다. 여기서는 TeamPost 구조입니다.
          # (위의 필드 이름 items와 다른 키입니다. 이 위치의 items는 array 전용 키워드입니다)
          items:
            $ref: '#/components/schemas/TeamPost'
        # pageInfo: 페이지 정보입니다. PageInfo 구조를 가져옵니다.
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
