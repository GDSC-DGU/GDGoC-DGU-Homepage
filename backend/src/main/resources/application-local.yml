# local: 개인 PC에서 실행할 때 쓰는 프로필 (기본값)
app:
  auth:
    allowed-origins: "${AUTH_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}"
    refresh-cookie-secure: false
  firestore:
    project-id: demo-gdgoc   # demo- 로 시작하는 ID는 에뮬레이터 전용 (실제 프로젝트에 닿지 않음)
    emulator-host: ${FIRESTORE_EMULATOR_HOST:localhost:8180}
  scoring:
    task-queue:
      mode: logging   # 큐에 넣지 않고 로그만 남김. Cloud Tasks를 직접 확인하려면 cloud-tasks로 바꾸고 나머지 값을 채운다
  internal-auth:
    mode: disabled   # /internal/** 인증 끔. local 전용 (시작할 때 WARN 로그)

logging:
  level:
    com.gdgocdgu.homepage: DEBUG
