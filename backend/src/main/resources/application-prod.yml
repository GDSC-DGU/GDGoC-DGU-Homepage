# prod: Cloud Run gdgoc-dgu-homepage (운영) 에서 쓰는 프로필
server:
  forward-headers-strategy: framework   # 프록시(Cloud Run) 뒤에서 원래 요청 주소 · https 인식

logging:
  level:
    com.gdgocdgu.homepage: INFO

app:
  auth:
    allowed-origins: "${AUTH_ALLOWED_ORIGINS:https://gdgoc-dgu.com}"
  firestore:
    project-id: ${GOOGLE_CLOUD_PROJECT:gdgoc-dgu-homepage}   # 인증은 Cloud Run 서비스 계정(ADC). 키 파일 없음
  scoring:
    task-queue:   # 채점 작업 큐 (F-RCT-004). 인증은 Cloud Run 서비스 계정(ADC)
      mode: cloud-tasks
      project-id: gdgoc-dgu-homepage
      location: asia-northeast3
      queue: scoring
      backend-url: https://backend-534333328238.asia-northeast3.run.app   # 요청 URL이자 OIDC audience
      invoker-service-account: tasks-invoker@gdgoc-dgu-homepage.iam.gserviceaccount.com
      dispatch-deadline: 240s
  internal-auth:   # /internal/** 는 Cloud Tasks(tasks-invoker)의 OIDC 토큰만 허용
    mode: oidc
    audience: ${app.scoring.task-queue.backend-url}
    allowed-service-accounts:
      - ${app.scoring.task-queue.invoker-service-account}
