# docs/api/ 의 OpenAPI 명세를 Swagger UI로 GitHub Pages에 배포합니다.
# - develop에 docs/api/** 변경이 머지되면 자동 배포, 수동 실행(workflow_dispatch)도 가능합니다.
# - 사전 설정: Settings → Pages → Source를 "GitHub Actions"로 지정해야 합니다.
name: api-docs

on:
  push:
    branches: [develop]
    paths: ["docs/api/**", ".github/workflows/api-docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api
      - id: deployment
        uses: actions/deploy-pages@v4
