                      isMine:
                        type: boolean
                      recruitStatus:
                        type: string
                      startDate:
                        type: string
                        format: date
                      endDate:
                        type: string
                        format: date
                      viewCount:
                        type: integer
                      isEdited:
                        type: boolean
                      createdAt:
                        type: string
                        format: date-time
                      attachments:
                        type: array
                        items:
                          type: object
                          properties:
                            fileId:
                              type: integer
                            fileName:
                              type: string
                            size:
                              type: integer
              example:
                success: true
                data:
                  postId: 42
                  board: TEAMS
                  category: STUDY
                  title: 알고리즘 스터디 모집
                  content: 매주 화요일 저녁에 ...
                  authorName: 홍길동
                  isAdminPost: false
                  isMine: true
                  recruitStatus: RECRUITING
                  startDate: '2026-11-10'
                  endDate: '2026-11-20'
                  viewCount: 36
                  isEdited: true
                  createdAt: '2026-11-05T21:00:00+09:00'
                  attachments:
