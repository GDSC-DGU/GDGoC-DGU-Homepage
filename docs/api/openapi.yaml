                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      content:
                        type: array
                        items:
                          type: object
                          properties:
                            postId:
                              type: integer
                            category:
                              type: string
                            title:
                              type: string
                            authorName:
                              type: string
                            isAdminPost:
                              type: boolean
                            viewCount:
                              type: integer
                            commentCount:
                              type: integer
                            createdAt:
                              type: string
                              format: date-time
                      page:
                        type: integer
                      size:
                        type: integer
                      totalElements:
                        type: integer
                      totalPages:
                        type: integer
              example:
                success: true
                data:
