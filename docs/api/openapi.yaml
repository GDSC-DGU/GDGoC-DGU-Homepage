        작성자 본인이 분류 · 제목 · 기간 · 내용 · 첨부 · 모집 상태(Teams) 수정. 저장 시 '수정됨' 표시

        **API ID**: `API-BRD-004` · **사용처**: FE-BE · **권한**: 회원 · **기능 명세서**: [F-BRD-003](https://app.notion.com/p/F-BRD-003-40b9f962b8af80928391e59f3013e7ed?pvs=21), [F-BRD-007](https://app.notion.com/p/F-BRD-007-40b9f962b8af8023b3baeb0c121086f6?pvs=21), [F-BRD-002](https://app.notion.com/p/F-BRD-002-40b9f962b8af80c884ebdd7e8b4081ae?pvs=21)

        **상세 규칙**

        - `attachmentIds`는 최종 첨부 목록 전체를 보냄. 빠진 기존 파일은 연결 해제 → OPS-005가 정리.
        - 직접 CLOSED로 바꾸면 종료일 전이라도 바로 마감, 자동 마감 재계산 대상에서 빠짐.
        - 모집 상태는 그대로 두고 종료일만 바꾸면 모집 상태를 다시 계산.
        - 로그인 시간(1시간)이 끝나 401이 나와도 FE는 입력 내용을 유지.
