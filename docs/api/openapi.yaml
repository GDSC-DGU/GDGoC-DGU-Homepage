            재활성화 시 비활성화에 따른 개인정보 삭제 예약을 취소
            상태 변경은 변경 이력에 기록
            선택한 사용자 중 하나라도 처리 조건을 충족하지 못하면 전체 요청을 처리하지 않음
          content:
            application/json:
              schema:
