                    message: 선택한 사용자의 활성 상태를 변경할 권한 없음
                SELF_DEACTIVATION_NOT_ALLOWED:
                  summary: 자기 자신 비활성화
                  value:
                    success: false
                    code: SELF_DEACTIVATION_NOT_ALLOWED
                    message: 자기 자신은 비활성화할 수 없음
        '404':
          description: 대상 사용자 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                USER_NOT_FOUND:
                  summary: 대상 사용자 없음
                  value:
                    success: false
                    code: USER_NOT_FOUND
                    message: 선택한 사용자 중 찾을 수 없는 사용자가 있음
        '409':
          description: 일괄 비활성화 후 활성 운영진이 0명이 되는 경우
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                LAST_ACTIVE_ADMIN:
                  summary: 일괄 비활성화 후 활성 운영진이 0명이 되는 경우
                  value:
                    success: false
                    code: LAST_ACTIVE_ADMIN
                    message: 활성 운영진이 최소 1명 있어야 함
  /api/v1/admin/user-change-logs:
    get:
      tags:
        - AUTH · 인증 · 사용자
      summary: '[API-AUTH-013] 사용자 변경 이력 조회'
      operationId: auth013
      x-roles:
        - 운영진
      description: |-
        사용자 변경 이력 조회, 검색

        **API ID**: `API-AUTH-013` · **사용처**: FE-BE · **권한**: 운영진 · **기능 명세서**: [F-AUTH-009](https://app.notion.com/p/F-AUTH-009-40b9f962b8af8030adc0f77ade925c71?pvs=21)

        **상세 규칙**

        - `startDate`·`endDate`: 함께 전달함. KST 기준 종료일 포함, 생략하면 오늘 포함 최근 30일
      parameters:
        - name: type
          in: query
          required: false
          description: |-
            생략하면 모든 종류 조회, 아래 값 중 하나
            - `USER_CREATED`: 사용자 추가
            - `USERS_BULK_REGISTERED`: 사용자 일괄 등록
            - `ROLE_CHANGED`: 관리 유형 변경
            - `INVITATION_SENT`: 초대 링크 발송
            - `INVITATION_RESENT`: 초대 링크 재발송
            - `GOOGLE_ACCOUNT_LINKED`: Google 계정 연결
            - `GOOGLE_ACCOUNT_UNLINKED`: Google 계정 연결 해제
            - `USER_DEACTIVATED`: 비활성화
            - `USER_REACTIVATED`: 재활성화
            - `PERSONAL_DATA_DELETED`: 개인정보 삭제
          schema:
            type: string
            example: ROLE_CHANGED
            enum:
              - USER_CREATED
              - USERS_BULK_REGISTERED
              - ROLE_CHANGED
              - INVITATION_SENT
              - INVITATION_RESENT
              - GOOGLE_ACCOUNT_LINKED
              - GOOGLE_ACCOUNT_UNLINKED
              - USER_DEACTIVATED
              - USER_REACTIVATED
              - PERSONAL_DATA_DELETED
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2026-10-10'
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2026-11-08'
        - name: keyword
          in: query
          required: false
          description: 처리자 이름·대상 이름·내용 검색. 생략하면 전체 조회
          schema:
            type: string
            example: 홍길동
        - name: page
          in: query
          required: false
          description: 기본값 `1`. 페이지당 20건 고정
          schema:
            type: integer
            example: 1
      security:
        - accessToken: []
      responses:
        '200':
          description: |-
            최신순으로 반환
            처리자 유형은 `ADMIN` / `SELF` / `SYSTEM`이며, 시스템 처리 시 `actor.userId`는 `null`. 결과가 없으면 `logs: []`로 반환
            개인정보가 삭제된 회원은 해당 `actor` 또는 `target`의 `userId`와 `name`을 `null`로 반환
            `content`에는 작업 내용만 표시, 예를 들어 ‘홍길동 회원을 비활성화함’은 ‘회원 계정을 비활성화함’으로 표시
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      logs:
                        type: array
                        items:
                          type: object
                          properties:
                            logId:
                              type: string
                            createdAt:
                              type: string
                              format: date-time
                            actor:
                              type: object
                              properties:
                                type:
                                  type: string
                                userId:
                                  type: string
                                name:
                                  type: string
                            target:
                              type: object
                              properties:
                                userId:
                                  type: string
                                name:
                                  type: string
                            type:
                              type: string
                            content:
                              type: string
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                          pageSize:
                            type: integer
                          totalCount:
                            type: integer
                          totalPages:
                            type: integer
              example:
                success: true
                data:
                  logs:
                    - logId: log_001
                      createdAt: '2026-11-08T15:00:00+09:00'
                      actor:
                        type: ADMIN
                        userId: usr_admin
                        name: 김동국
                      target:
                        userId: usr_001
                        name: 홍길동
                      type: ROLE_CHANGED
                      content: 관리 유형을 General에서 Core로 변경
                  pagination:
                    page: 1
                    pageSize: 20
                    totalCount: 1
                    totalPages: 1
        '400':
          description: 조회 조건 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  summary: 조회 조건 오류
                  value:
                    success: false
                    code: VALIDATION_FAILED
                    message: 요청 형식이 올바르지 않습니다.
        '401':
          description: 로그인 정보 없음·만료·무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                AUTH_REQUIRED:
                  summary: 로그인 정보 없음·만료·무효
                  value:
                    success: false
                    code: AUTH_REQUIRED
                    message: 다시 로그인해 주세요.
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  summary: 권한 없음
                  value:
                    success: false
                    code: FORBIDDEN
                    message: 사용자 변경 이력을 조회할 권한 없음.
  /api/v1/posts:
