                  default: 30
                  description: 면접 시간(분). 생략하면 30
                location:
                  type: string
                interviewers:
                  type: array
                  minItems: 1
                  description: 면접관 userId. 활성 운영진(`ADMIN`)만, 1명 이상
                  items:
                    type: string
            example:
              startAt: '2027-03-10T14:00:00+09:00'
              durationMin: 30
              location: 신공학관 3층
              interviewers:
                - usr_001
      description: |-
        서류 합격자 면접 일정 지정 · 변경

        **API ID**: `API-RCT-021` · **사용처**: FE-BE · **권한**: 운영진 · **기능 명세서**: [F-RCT-007](https://app.notion.com/p/F-RCT-007-40b9f962b8af80d3a6dfc9d59885c184?pvs=21)

        **상세 규칙**

        - `durationMin`을 생략하면 30분으로 봅니다.
        - `startAt`은 10분 단위만 허용합니다. 아니면 `VALIDATION_FAILED`.
        - `interviewers`는 활성 운영진(`ADMIN`)만, 1명 이상이어야 합니다. 아니면 `VALIDATION_FAILED`.
        - 겹침 검사: `startAt`부터 `startAt + durationMin`까지를 면접 시간으로 보고, 같은 면접관의 다른 면접 시간과 겹치면 `SLOT_CONFLICT`.
        - 서류 합격 메일을 이미 보낸 지원자의 일정을 바꾸면 `noticeRequired: true`를 돌려줍니다. 변경 안내는 운영진이 따로 합니다.
      parameters:
        - name: aid
          in: path
          required: true
          schema:
            type: string
      security:
        - accessToken: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      aid:
                        type: string
                      interviewAt:
                        type: string
                        format: date-time
                      noticeRequired:
                        type: boolean
              example:
                success: true
                data:
                  aid: a_7f3c
                  interviewAt: '2027-03-10T14:00:00+09:00'
                  noticeRequired: false
        '400':
          description: 10분 단위가 아닌 시작 시각 · 면접관 없음 · 활성 운영진이 아닌 면접관
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  value:
                    success: false
                    code: VALIDATION_FAILED
                    message: 입력 값을 확인해주세요.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 서류 합격자 아님 / 면접관 시간 겹침
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
