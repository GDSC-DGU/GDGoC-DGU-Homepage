        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pagePath
              properties:
                pagePath:
                  type: string
            example:
              pagePath: /teams
      description: |-
        홈페이지 방문 기록

        **API ID**: `API-OPS-010` · **사용처**: FE-BE · **권한**: 공개 · **기능 명세서**: [F-OPS-003](https://app.notion.com/p/F-OPS-003-40b9f962b8af805386eff9bca503cc6b?pvs=21)

        **상세 규칙**

        `pagePath`: 방문한 화면 경로. 필수이며 쿼리스트링·해시는 제외
        - 자체 집계 방식 기준의 명세이며, 중복 방문은 F-OPS-003의 기준으로 판정함
      security: []
      responses:
        '200':
          description: |-
            KST 기준으로 방문을 기록하고 일·주 단위 집계에 반영
            관리자 화면 방문은 기록하지 않고 `counted: false`로 반환
            오늘 또는 이번 주 중 하나라도 새로 집계됐으면 `true`, 둘 다 이미 집계됐으면 `false`
            로그인으로 기존 비로그인 방문을 합치는 것만으로는 집계 인원이 늘지 않음. 오늘과 이번 주 모두 새로 집계된 인원이 없으면 `counted: false`를 반환
            사용자 ID·이메일·IP 등 개인 식별 정보는 방문 집계에 저장하지 않음
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      counted:
                        type: boolean
              example:
                success: true
                data:
                  counted: true
        '400':
          description: 화면 경로 누락·형식 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  summary: 화면 경로 누락·형식 오류
                  value:
                    success: false
                    code: VALIDATION_FAILED
                    message: 요청 형식이 올바르지 않습니다.
        '500':
          description: |-
            방문 기록 실패
            방문 기록 실패로 홈페이지 이용을 중단하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VISIT_RECORD_FAILED:
                  summary: 방문 기록 실패
                  value:
                    success: false
                    code: VISIT_RECORD_FAILED
                    message: 방문 기록 저장 실패
  /internal/jobs/personal-data-cleanup:
    post:
      tags:
        - OPS · 운영
      summary: '[API-OPS-011] 보유 기간 만료 개인정보 정리'
      operationId: ops011
      description: |-
        보유 기간 만료 개인정보 자동 삭제

        **API ID**: `API-OPS-011` · **사용처**: BE-BE · **권한**: 서비스 계정 · **기능 명세서**: [F-OPS-004](https://app.notion.com/p/F-OPS-004-40b9f962b8af8030977bc2b526129dcc?pvs=21)

        **상세 규칙**

        - 허용된 서비스 계정만 호출 가능.
      security:
        - serviceAccount: []
      responses:
        '200':
          description: |-
            - 지원서: 제출일로부터 1년이 지난 지원서의 개인정보와 관련 응답·점수·처리 이력의 개인정보를 삭제
            - 사용자: 비활성화 후 1년이 지난 사용자의 개인정보, Google 연결 정보, 로그인 기록, 초대 링크를 삭제, 재활성화된 사용자는 제외, 기존 변경 이력의 처리자 · 대상 정보와 `content`에 남은 해당 회원의 식별 정보를 정리
            - `deletedUserCount`는 개인정보 삭제가 완료된 사용자 수. 삭제 대상이 없으면 각 건수는 `0`
            - 삭제 내역은 개인정보를 제외하고 변경 이력에 ‘시스템’ 처리로 기록
            - 개인정보 정리 작업은 매일 오전 3시(KST)에 실행함
            - 개인정보가 삭제된 사용자의 글 · 댓글 작성자 표시는 F-OPS-004의 규칙을 따름
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      deletedApplicationCount:
                        type: integer
                      deletedUserCount:
                        type: integer
              example:
                success: true
                data:
                  deletedApplicationCount: 12
                  deletedUserCount: 3
        '401':
          description: 서비스 계정 인증 없음·만료·무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                AUTH_REQUIRED:
                  summary: 서비스 계정 인증 없음·만료·무효
                  value:
                    success: false
                    code: AUTH_REQUIRED
                    message: 서비스 계정 인증을 확인할 수 없음
        '403':
          description: 실행 권한 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  summary: 실행 권한 없음
                  value:
                    success: false
                    code: FORBIDDEN
                    message: 개인정보 정리 작업을 실행할 권한 없음
        '500':
          description: |-
            개인정보 정리 실패
            일부 항목이 삭제된 뒤 실패할 수 있으며, 재실행 시 삭제가 완료되지 않은 대상만 처리
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                PERSONAL_DATA_CLEANUP_FAILED:
                  summary: 개인정보 정리 실패
                  value:
                    success: false
                    code: PERSONAL_DATA_CLEANUP_FAILED
                    message: 개인정보 정리 작업 실패
  /internal/jobs/expired-auth-cleanup:
    post:
      tags:
        - OPS · 운영
      summary: '[API-OPS-012] 만료 초대 링크·로그인 기록 정리'
      operationId: ops012
      description: |-
        만료, 사용 종료된 초대 링크와 로그인 기록 자동 정리

        **API ID**: `API-OPS-012` · **사용처**: BE-BE · **권한**: 서비스 계정 · **기능 명세서**: [F-OPS-006](https://app.notion.com/p/F-OPS-006-4109f962b8af803fb4bcc651440af4e0?pvs=21)

        **상세 규칙**

        - 허용된 서비스 계정만 호출 가능
        - 예약 작업 방식을 선택할 때 사용하는 명세. 실행 시각은 별도 확정
      security:
        - serviceAccount: []
      responses:
        '200':
          description: |-
            - 초대 링크 토큰: 발송 후 72시간이 지났거나 사용·무효 처리된 토큰을 삭제
            - 로그인 기록: 최초 로그인 후 1시간이 지났거나 로그아웃·무효 처리된 refresh token 기록을 삭제
            - 초대 토큰을 삭제해도 사용자의 ‘연결 대기’ 상태는 변경하지 않음
            - 삭제 건수를 시스템 로그에 기록함. 삭제 대상이 없으면 각 건수는 `0`
            - 예약 작업 실행 여부와 관계없이, 각 인증 API는 요청 시 토큰의 만료·사용·무효 여부를 확인
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      deletedInvitationTokenCount:
                        type: integer
                      deletedRefreshTokenCount:
                        type: integer
              example:
                success: true
                data:
                  deletedInvitationTokenCount: 17
                  deletedRefreshTokenCount: 21
        '401':
          description: 서비스 계정 인증 없음·만료·무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                AUTH_REQUIRED:
                  summary: 서비스 계정 인증 없음·만료·무효
                  value:
                    success: false
                    code: AUTH_REQUIRED
                    message: 서비스 계정 인증 확인 불가.
        '403':
          description: 실행 권한 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  summary: 실행 권한 없음
                  value:
                    success: false
                    code: FORBIDDEN
                    message: 만료 인증 정보 정리 작업을 실행할 권한 없음.
        '500':
          description: |-
            인증 정보 정리 실패
            일부 항목이 삭제된 뒤 실패할 수 있으며, 재실행 시 남은 삭제 대상만 처리
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EXPIRED_AUTH_CLEANUP_FAILED:
                  summary: 인증 정보 정리 실패
                  value:
                    success: false
                    code: EXPIRED_AUTH_CLEANUP_FAILED
                    message: 만료 인증 정보 정리 작업 실패.
  /internal/jobs/files/cleanup:
    post:
      tags:
        - OPS · 운영
      summary: '[API-OPS-013] 미연결 첨부파일 정리'
      operationId: ops013
      description: |-
        스케줄러가 주기적으로 호출. 업로드 후 24시간 동안 게시글 · 프로젝트에 연결되지 않은 파일을 저장소와 DB에서 삭제

        **API ID**: `API-OPS-013` · **사용처**: BE-BE · **권한**: 서비스 계정 (Scheduler) · **기능 명세서**: [F-OPS-005](https://app.notion.com/p/F-OPS-005-40b9f962b8af80f2bb00e64fca6c7250?pvs=21)

        **상세 규칙**

        - 실행 주기: 매시간 정각 (KST), Cloud Scheduler가 호출.
        - 삭제 대상: 게시글 첨부(API-BRD-009) · 프로젝트 이미지(API-PRJ-005) 중 게시글 · 프로젝트에 연결되지 않은 상태로 업로드(또는 연결 해제) 후 24시간이 지난 파일.
        - 실행 방식: 대상 조회 → 저장소에서 파일 삭제 → DB에서 삭제. 저장소 삭제에 실패한 파일은 DB에 남겨 다음 실행 때 다시 시도.
        - 한 번에 최대 500개까지 처리하고, 남으면 다음 실행 때 이어서 처리.
      security:
        - serviceAccount: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      deletedCount:
                        type: integer
              example:
                success: true
                data:
                  deletedCount: 12
        '401':
          description: 서비스 계정 인증 없음·만료·무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                AUTH_REQUIRED:
                  summary: 서비스 계정 인증 없음·만료·무효
                  value:
                    success: false
                    code: AUTH_REQUIRED
                    message: 인증되지 않은 요청입니다.
  /api/v1/chatbot/messages:
    post:
      tags:
        - COM · 챗봇
      summary: '[API-COM-001] 챗봇 질문 · 답변'
      operationId: com001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                history:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum:
                          - user
                          - assistant
                      content:
                        type: string
                  description: 같은 대화창의 이전 대화
            example:
              message: string
              history:
                - role: user
                  content: string
      description: |-
        방문자 질문을 받아 홈페이지 공개 정보 범위에서 AI 답변을 생성해 반환

        **API ID**: `API-COM-001` · **사용처**: FE-BE · **권한**: 공개 · **기능 명세서**: [F-COM-004](https://app.notion.com/p/F-COM-004-40b9f962b8af804db3c5cfac9f397391?pvs=21)

        **상세 규칙**

        - 구현 여부 · 시점 미정 (AI 채점 이후 개발 예정). Status는 '시작 전' 유지.
        - 백엔드 → AI 서비스 호출 부분은 BE-AI 성격. AI 채점(A 파트)과 같은 AI 연동 코드를 재사용하면 좋음.
        - 답변 근거는 공개 정보(동아리 소개, 모집 일정, 활동 안내)만 넣고, 지원서 · 회원 정보는 절대 넣지 않음.
        - 대화 기록 저장 여부 · 사용량 제한은 미정. 우선 서버에 저장하지 않고 FE가 history를 들고 있는 방식으로 작성.
      security: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      answer:
                        type: string
              example:
                success: true
                data:
                  answer: 이번 기수 모집은 11월 10일부터 20일까지예요. Recruits 메뉴에서 지원할 수 있어요.
        '400':
          description: 질문 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  summary: 질문 없음
                  value:
                    success: false
                    code: VALIDATION_ERROR
                    message: 질문을 입력해 주세요.
        '429':
          description: 짧은 시간에 너무 많이 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                TOO_MANY_REQUESTS:
                  summary: 짧은 시간에 너무 많이 요청
                  value:
                    success: false
                    code: TOO_MANY_REQUESTS
                    message: 잠시 후 다시 시도해 주세요.
        '503':
          description: AI 답변 생성 실패 · 시간 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CHATBOT_UNAVAILABLE:
                  summary: AI 답변 생성 실패 · 시간 초과
                  value:
                    success: false
                    code: CHATBOT_UNAVAILABLE
                    message: 잠시 후 다시 시도해 주세요.
components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        로그인 후 서버(AUTH-001 · 005)가 응답 본문으로 준 access 토큰을
        `Authorization: Bearer {accessToken}` 헤더로 보냅니다. 프론트는 메모리에만 보관합니다.
        refresh 토큰은 HttpOnly 쿠키로 따로 내려가고 갱신(AUTH-002)에서만 씁니다.
        권한은 토큰의 역할로 검사합니다: 회원 = 로그인한 모든 사용자, 운영진 = Lead · Core(같은 권한).
    serviceAccount:
      type: http
      scheme: bearer
      bearerFormat: OIDC
      description: |
        내부 API(`/internal/*`) 전용. Cloud Tasks · Cloud Scheduler가 보내는
        Google 서비스 계정 OIDC 토큰(audience = backend URL)으로 인증합니다.
        허용 계정이 아니면 403, 토큰이 없거나 잘못되면 401. 사용자 JWT로는 호출할 수 없습니다.
  schemas:
    ErrorResponse:
      type: object
      description: 모든 실패 응답의 공통 형태. `data`는 넣지 않습니다.
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          enum:
            - false
        code:
          type: string
          example: NOT_FOUND
        message:
          type: string
          example: 대상을 찾을 수 없습니다.
  responses:
    Unauthorized:
      description: 로그인 정보 없음 · 만료 · 무효(AUTH_REQUIRED). 만료면 AUTH-002로 갱신 후 다시 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: AUTH_REQUIRED
            message: 다시 로그인해 주세요.
    Forbidden:
      description: 역할 부족
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: FORBIDDEN
            message: 권한이 없습니다.
