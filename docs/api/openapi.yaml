  /api/v1/schedules:
    get:
      tags:
        - HOM · 일정 캘린더
      summary: '[API-HOM-001] 일정 목록 조회'
      operationId: hom001
      description: |-
        기간별 일정 목록 (캘린더, 최대 62일 ≒ 두 달)

        **API ID**: `API-HOM-001` · **사용처**: FE-BE · **권한**: 공개 · **기능 명세서**: [F-HOM-004](https://app.notion.com/p/F-HOM-004-40b9f962b8af805ca8d7d53001930500?pvs=21)

        **상세 규칙**

        - 일정 ID는 `scheduleId` 하나로 씁니다(대시보드 OPS-009의 `upcomingSchedules[].scheduleId`와 같은 이름 · 값).
        - 게시글 일정의 `link.board`는 게시판 값(`COMMUNITY`), 분류는 `category`(`SESSION` · `EVENT`)입니다. 프론트는 `postId`로 원글을 엽니다.

        | source | 만드는 곳 | 캘린더에 보이는 것 | 수정 · 삭제 |
        | --- | --- | --- | --- |
        | `RECRUITMENT` | 모집 회차(게시된 폼이 있을 때) | 지원 **마감일** 하루 | RCT-008에서 기간 변경 |
        | `POST` | Community의 세션 · 행사 글(BRD-015) | 글의 기간 | 원본 글 수정 · 삭제(BRD-017 · 013) |
        | `MANUAL` | 운영진 직접 등록(HOM-003) | 등록한 기간 | HOM-004 · 005 |

        > `MANUAL` 일정을 계속 둘지는 F-HOM-004(모집 마감 · 세션 · 행사만 표시)와 함께 팀이 확정합니다.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2027-03-01'
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2027-03-31'
        - name: category
          in: query
          required: false
          description: '선택: RECRUIT | SESSION | EVENT | ETC'
          schema:
            type: string
            enum:
              - RECRUIT
              - SESSION
              - EVENT
              - ETC
      security: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      schedules:
                        type: array
                        items:
                          type: object
                          properties:
                            scheduleId:
                              type: string
                            title:
                              type: string
                            category:
                              type: string
                            startAt:
                              type: string
                              format: date-time
                            endAt:
                              type: string
                              format: date-time
                            allDay:
                              type: boolean
                            source:
                              type: string
                            link:
                              type: object
                              properties:
                                type:
                                  type: string
                                rid:
                                  type: string
                                board:
                                  type: string
                                postId:
                                  type: integer
              example:
                success: true
                data:
                  schedules:
                    - scheduleId: rct_5_deadline
                      title: 5기 지원 마감
                      category: RECRUIT
                      startAt: '2027-03-05T00:00:00+09:00'
                      endAt: '2027-03-05T23:59:59+09:00'
                      allDay: true
                      source: RECRUITMENT
                      link:
                        type: APPLY_FORM
                        rid: rct_5
                    - scheduleId: post_42
                      title: GDG 홈커밍 데이
                      category: EVENT
                      startAt: '2027-03-20T14:00:00+09:00'
                      endAt: '2027-03-20T18:00:00+09:00'
                      allDay: false
                      source: POST
                      link:
                        type: POST
                        board: COMMUNITY
                        postId: 42
        '400':
          description: 62일 초과 · 날짜 형식 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  value:
                    success: false
                    code: VALIDATION_FAILED
                    message: 조회 기간은 최대 62일입니다.
