  /internal/scoring:
    post:
      tags:
        - RCT · 모집
      summary: '[API-RCT-028] 지원서 AI 채점'
      operationId: rct028
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                aid:
                  type: string
                criteriaVersion:
                  type: integer
            example:
              aid: a_7f3c
              criteriaVersion: 2
      description: |-
        지원서 1건 채점. Cloud Tasks → backend, backend → AI `/grading`

        **API ID**: `API-RCT-028` · **사용처**: BE-AI · **권한**: 서비스 계정 · **기능 명세서**: [F-RCT-004](https://app.notion.com/p/F-RCT-004-40b9f962b8af80118653c40c82230390?pvs=21)

        **상세 규칙**

        **호출 1 — Cloud Tasks → backend** (이 API)
        - 호출 주체: Cloud Tasks 큐 `scoring`, 서비스 계정 OIDC 토큰, audience = backend URL. 사용자 JWT로는 호출할 수 없습니다.
        - 이미 `RUNNING`이면 채점하지 않고 `RUNNING`을 돌려줍니다. 지원서의 현재 기준 버전과 요청의 `criteriaVersion`이 다르면 `SKIPPED_STALE`.

        **호출 2 — backend → AI** `POST {AI_URL}/grading` (FastAPI, 서비스 계정 인증)
        ```json
        { "applicationId": "a_7f3c",
          "items": [{ "itemId": "motivation", "name": "지원 동기", "questionIds": ["q1"], "guide": "..." }],
          "answers": [{ "questionId": "q1", "question": "지원 동기를 적어주세요.", "text": "..." }] }
        ```
        AI 응답: `{ success, applicationId, results: [{ itemId, level(1~5), reason }], instructionIgnored, model, promptVersion }`
        - 변환: 이름 · 학번 · 학과 · 이메일 · 전화번호는 보내지 않습니다. 선택형 답은 선택지 문자열을 `, `로 이어 `text`에 넣습니다.
        - 점수: backend가 `level / 5 × weight`로 항목 점수를, 합을 정수 반올림해 총점을 계산합니다(AI는 level만 반환).
        - 실패 처리: AI 422(입력 오류)는 영구 실패 → `FAILED`로 저장하고 200. AI 503 · 502 · 500은 일시 실패 → 503을 돌려 Cloud Tasks가 재시도(최대 3회). 3회 초과 시 `FAILED`.
      security:
        - serviceAccount: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      aid:
                        type: string
                      scoringStatus:
                        type: string
                        enum:
                          - DONE
                          - RUNNING
                          - SKIPPED_STALE
                          - FAILED
              example:
                success: true
                data:
                  aid: a_7f3c
                  scoringStatus: DONE
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: AI 일시 실패(503 · 502 · 500) → Cloud Tasks 재시도
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SCORING_RETRY:
                  value:
                    success: false
                    code: SCORING_RETRY
                    message: 채점을 다시 시도합니다.
