      summary: '[API-RCT-008] 모집 회차 수정 · 상태 변경'
      operationId: rct008
      x-roles:
        - 운영진
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                applyStartAt:
                  type: string
                  format: date-time
                applyEndAt:
                  type: string
                  format: date-time
                tracks:
                  type: array
                  items:
                    type: string
                noticeMarkdown:
                  type: string
                cohort:
                  type: integer
                status:
                  type: string
                  enum:
                    - SCHEDULED
                    - OPEN
                    - CLOSED
            example:
              title: string
              applyStartAt: '2027-02-20T00:00:00+09:00'
              applyEndAt: '2027-03-05T23:59:59+09:00'
              tracks:
                - string
              noticeMarkdown: string
              cohort: 5
              status: SCHEDULED
      description: |-
        기간 · 안내 수정, 모집 상태 변경 (허용된 전이만)

        **API ID**: `API-RCT-008` · **사용처**: FE-BE · **권한**: 운영진 · **기능 명세서**: [F-RCT-001](https://app.notion.com/p/F-RCT-001-40b9f962b8af804d9919edb8608583d2?pvs=21)

        **상세 규칙**

        - 바꿀 필드만 보냅니다.

        | 현재 status | 바꿀 수 있는 값 | 조건 |
        | --- | --- | --- |
        | `DRAFT` | `SCHEDULED` | 지원폼 게시(RCT-011) 완료 |
        | `SCHEDULED` · `OPEN` | `CLOSED` | 수동 마감. `applyState`는 `CLOSED_MANUALLY` |
        | `CLOSED`(수동) | `OPEN` | 재개. 현재 ≤ applyEndAt 일 때만 |

        - `SCHEDULED → OPEN`, `OPEN → CLOSED`(기간 종료)는 RCT-030이 저장합니다. 단 지원 가능 판단은 저장된 값이 아니라 RCT-001의 규칙으로 매번 계산합니다.
        - 기간을 바꾸면 모집 마감 일정(HOM)도 함께 바뀝니다.
      parameters:
        - name: rid
          in: path
          required: true
          schema:
            type: string
      security:
        - accessToken: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      rid:
                        type: string
                      cohort:
                        type: integer
                      title:
                        type: string
                      status:
                        type: string
                      applyStartAt:
                        type: string
                        format: date-time
                      applyEndAt:
                        type: string
                        format: date-time
                      tracks:
                        type: array
                        items:
                          type: string
                      noticeMarkdown:
                        type: string
                      applyState:
                        type: string
              example:
                success: true
                data:
                  rid: rct_5
                  cohort: 5
                  title: GDGoC DGU 5기 멤버 모집
                  status: SCHEDULED
                  applyStartAt: '2027-02-20T00:00:00+09:00'
                  applyEndAt: '2027-03-05T23:59:59+09:00'
                  tracks:
                    - BE
                    - FE
                    - AI
                    - Mobile
                  noticeMarkdown: 모집 안내 본문
                  applyState: BEFORE_START
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 허용되지 않은 상태 전이 / 지원폼 미게시 / 합격자 등록 후 기수 변경
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_STATUS_TRANSITION:
                  value:
                    success: false
                    code: INVALID_STATUS_TRANSITION
                    message: 현재 상태에서 바꿀 수 없는 상태입니다.
                FORM_NOT_PUBLISHED:
                  value:
                    success: false
                    code: FORM_NOT_PUBLISHED
                    message: 지원폼을 먼저 게시해주세요.
                COHORT_LOCKED:
                  value:
                    success: false
                    code: COHORT_LOCKED
                    message: 합격자 등록 후에는 기수를 바꿀 수 없습니다.
