                    success: false
                    code: VALIDATION_ERROR
                    message: 필수 항목입니다.
                RECRUIT_PERIOD_ENDED:
                  summary: 기간이 끝난 글을 모집중으로 변경
                  value:
                    success: false
                    code: RECRUIT_PERIOD_ENDED
                    message: 모집 기간이 끝난 글은 종료일을 바꿔야 모집중으로 바꿀 수 있어요.
                INVALID_ATTACHMENT:
