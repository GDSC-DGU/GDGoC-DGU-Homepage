                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - SENT
                          - SKIPPED
                          - FAILED
                      error:
                        type: string
                        description: '`FAILED`일 때만. 예 `INVALID_EMAIL`, `MAIL_AUTH_FAILED`'
              example:
                success: true
