                    message: 서류 합격자만 면접 일정을 지정할 수 있습니다.
                SLOT_CONFLICT:
                  value:
                    success: false
                    code: SLOT_CONFLICT
                    message: 같은 시간에 면접관 일정이 겹칩니다.
