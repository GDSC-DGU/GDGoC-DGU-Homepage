        - name: keyword
          in: query
          required: false
          description: 제목 · 내용 · 작성자
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 기본 0
          schema:
            type: integer
        - name: size
          in: query
          required: false
          description: 기본 20
          schema:
            type: integer
      security:
