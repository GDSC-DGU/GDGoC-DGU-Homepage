        - 기간(startDate · endDate)은 Teams 글과 Community 세션 · 행사 글에만 값이 있고 나머지는 null.
        - 삭제된 글은 404가 아니라 410 → FE가 '삭제된 게시글입니다.' 안내 후 목록 이동.
        - 같은 사용자 반복 조회 시 조회수 제한 방식은 미정.
