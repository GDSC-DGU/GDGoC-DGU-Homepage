openapi: 3.0.3
info:
  title: GDGoC DGU 홈페이지 API
  version: 0.1.0
  description: |
    GDGoC DGU 홈페이지 backend API. **이 문서가 API 명세의 기준**입니다(노션은 목록 · 링크만 유지). API ID는 노션 목록과 같습니다.

    ## 공통 규칙

    **성공 응답**: 값은 항상 `data` 안에. 돌려줄 값이 없으면 `"data": null`.

    ```json
    { "success": true, "data": { "aid": "a_7f3c" } }
    ```

    **실패 응답**: `data` 없이 코드와 메시지. HTTP 상태와 `success`는 항상 일치합니다. 프론트는 `message`가 아니라 `code`로 분기합니다.

    ```json
    { "success": false, "code": "NOT_FOUND", "message": "대상을 찾을 수 없습니다." }
    ```

    **인증**: access 토큰은 `Authorization: Bearer {accessToken}` 헤더, refresh 토큰은 HttpOnly 쿠키(AUTH-002 전용). 내부 API(`/internal/*`)는 서비스 계정 OIDC 토큰.

    **권한**: 공개 · 회원(로그인한 사용자) · 운영진(`role: ADMIN`, Lead · Core 같은 권한).

    **형식**: `cohort`는 정수(예: `5`), 학번 `studentId`는 숫자 10자리 문자열, 관리 유형 `role`은 `ADMIN`(운영진) · `GENERAL`(일반), ID 예시는 `usr_001` 형식, 시각은 ISO 8601 KST(`+09:00`).

    **목록**: `page`(1부터, 기본 1) · `pageSize`(기본 20, 최대 100) → `data`에 목록 배열(예: `users`, `applications`)과 `pagination`(`page` · `pageSize` · `totalCount` · `totalPages`). AUTH-008 형식 기준. BRD · PRJ는 아직 `page`(0부터) · `size` 형식입니다.

    **수정(PATCH · PUT)**: 생략한 필드는 유지, 빈 배열 `[]`은 비우기.

    **지원서 파일**: 받지 않습니다. 링크는 `URL` 문항으로 받습니다.

    ## 공통 오류 코드

    | HTTP | code | 상황 |
    | --- | --- | --- |
    | 400 | `VALIDATION_FAILED` | 입력 형식 · 필수값 오류 |
    | 401 | `AUTH_REQUIRED` | 로그인 정보 없음 · 만료 · 무효 → AUTH-002로 갱신 시도 |
    | 403 | `FORBIDDEN` | 권한 없음 |
    | 404 | `NOT_FOUND` | 대상 없음(메시지로 대상 구분) |
    | 405 | `METHOD_NOT_ALLOWED` | 지원하지 않는 메서드 |
    | 413 | `FILE_TOO_LARGE` | 업로드 용량 초과 |
    | 415 | `UNSUPPORTED_FILE_TYPE` | 업로드 형식 오류 |
    | 429 | `RATE_LIMITED` | 요청 과다 |
    | 500 | `INTERNAL_ERROR` | 예상 못 한 오류 |

    기능별 코드(`APPLICATION_DUPLICATED`, `STAGE_CONFIRMED` 등)는 각 API의 실패 응답에 있습니다. 이름은 `대상_상태` 형태로 짓습니다.

    > AUTH · OPS · BRD · PRJ · COM은 담당자가 노션 API 페이지에 쓴 명세(11/17)를 옮긴 것입니다. 위 공통 규칙과 다른 곳은 `docs/openapi/REVIEW.md` 4장에 있습니다. 이후 수정은 노션이 아니라 `paths/` 아래 자기 파일에서 합니다.
servers:
  - url: http://localhost:8080
    description: 로컬 (Spring Boot 기본 포트)
tags:
  - name: AUTH · 인증 · 사용자
  - name: BRD · 게시판
  - name: PRJ · 프로젝트
  - name: HOM · 일정 캘린더
  - name: RCT · 모집
  - name: OPS · 운영
  - name: COM · 챗봇
paths:
  /api/v1/auth/google:
    post:
      tags:
        - AUTH · 인증 · 사용자
      summary: '[API-AUTH-001] Google 로그인'
      operationId: auth001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idToken
              properties:
                idToken:
                  type: string
            example:
              idToken: '{googleIdToken}'
      description: |-
        Google 로그인

        **API ID**: `API-AUTH-001` · **사용처**: FE-BE · **권한**: 공개 · **기능 명세서**: [F-AUTH-001](https://app.notion.com/p/F-AUTH-001-40b9f962b8af8036a2efd26d183b9377?pvs=21)
      security: []
      responses:
        '200':
          description: |-
            refresh token은 응답 쿠키로 전달함
            ```
            Set-Cookie: refreshToken={refreshToken}; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth; Max-Age=3600
            Cache-Control: no-store
            ```
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      tokenType:
                        type: string
                      expiresIn:
                        type: integer
                      sessionExpiresAt:
                        type: string
                        format: date-time
                      user:
                        type: object
                        properties:
                          userId:
                            type: string
                          name:
                            type: string
                          role:
                            type: string
              example:
                success: true
                data:
                  accessToken: '{accessToken}'
                  tokenType: Bearer
                  expiresIn: 900
                  sessionExpiresAt: '2026-11-08T16:00:00+09:00'
                  user:
                    userId: usr_001
                    name: 홍길동
                    role: GENERAL
        '400':
          description: 필수값 누락·형식 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  summary: 필수값 누락·형식 오류
                  value:
                    success: false
                    code: VALIDATION_FAILED
                    message: 요청 형식이 올바르지 않습니다.
        '401':
          description: Google ID 토큰 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_GOOGLE_TOKEN:
                  summary: Google ID 토큰 검증 실패
                  value:
                    success: false
                    code: INVALID_GOOGLE_TOKEN
                    message: Google 인증 확인 불가. 다시 로그인해 주세요.
        '403':
          description: |-
            - 연결되지 않은 Google 계정
            - 비활성 사용자
            - 허용되지 않은 요청 출처
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                GOOGLE_ACCOUNT_NOT_LINKED:
                  summary: 연결되지 않은 Google 계정
                  value:
                    success: false
                    code: GOOGLE_ACCOUNT_NOT_LINKED
                    message: 연결되지 않은 Google 계정. 초대 링크로 계정 먼저 연결해 주세요.
                USER_INACTIVE:
                  summary: 비활성 사용자
                  value:
                    success: false
                    code: USER_INACTIVE
                    message: 비활성화된 사용자. 운영진에게 문의해주세요.
                INVALID_ORIGIN:
                  summary: 허용되지 않은 요청 출처
                  value:
                    success: false
                    code: INVALID_ORIGIN
                    message: 허용되지 않은 요청
  /api/v1/auth/refresh:
    post:
      tags:
        - AUTH · 인증 · 사용자
      summary: '[API-AUTH-002] 로그인 토큰 갱신'
      operationId: auth002
      x-roles:
        - 회원
      description: |-
        로그인 토큰 갱신

        **API ID**: `API-AUTH-002` · **사용처**: FE-BE · **권한**: 회원 · **기능 명세서**: [F-AUTH-001](https://app.notion.com/p/F-AUTH-001-40b9f962b8af8036a2efd26d183b9377?pvs=21)
      security:
        - accessToken: []
      responses:
        '200':
          description: |-
            `expiresIn`은 900초와 로그인 최종 만료까지 남은 시간 중 짧은 값
            갱신해도 최초 로그인부터 1시간인 최종 만료 시각은 연장되지 않음
            ```
            Cache-Control: no-store
            ```
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      tokenType:
                        type: string
                      expiresIn:
                        type: integer
                      sessionExpiresAt:
                        type: string
                        format: date-time
                      user:
                        type: object
                        properties:
                          userId:
                            type: string
                          name:
                            type: string
                          role:
                            type: string
              example:
                success: true
                data:
                  accessToken: '{accessToken}'
                  tokenType: Bearer
                  expiresIn: 900
                  sessionExpiresAt: '2026-11-08T16:00:00+09:00'
                  user:
                    userId: usr_001
                    name: 홍길동
                    role: GENERAL
        '401':
          description: |-
            - refresh token 없음
            - 유효하지 않은 refresh token
            - 로그인 시간 만료
            - 로그아웃·계정 변경으로 로그인 무효화
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                REFRESH_TOKEN_REQUIRED:
                  summary: refresh token 없음
                  value:
                    success: false
                    code: REFRESH_TOKEN_REQUIRED
                    message: 다시 로그인해 주세요.
                INVALID_REFRESH_TOKEN:
                  summary: 유효하지 않은 refresh token
                  value:
                    success: false
                    code: INVALID_REFRESH_TOKEN
                    message: 로그인 정보 확인 불가. 다시 로그인해 주세요.
                SESSION_EXPIRED:
                  summary: 로그인 시간 만료
                  value:
                    success: false
                    code: SESSION_EXPIRED
                    message: 로그인 시간 만료. 다시 로그인해 주세요.
                SESSION_REVOKED:
                  summary: 로그아웃·계정 변경으로 로그인 무효화
                  value:
                    success: false
                    code: SESSION_REVOKED
                    message: 로그인이 해제됨. 다시 로그인해 주세요.
        '403':
          description: 허용되지 않은 요청 출처
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_ORIGIN:
                  summary: 허용되지 않은 요청 출처
                  value:
                    success: false
                    code: INVALID_ORIGIN
                    message: 허용되지 않은 요청
  /api/v1/auth/logout:
    post:
      tags:
        - AUTH · 인증 · 사용자
      summary: '[API-AUTH-003] 로그아웃'
      operationId: auth003
      x-roles:
        - 회원
      description: |-
        로그아웃

        **API ID**: `API-AUTH-003` · **사용처**: FE-BE · **권한**: 회원 · **기능 명세서**: [F-AUTH-001](https://app.notion.com/p/F-AUTH-001-40b9f962b8af8036a2efd26d183b9377?pvs=21)
      security:
        - accessToken: []
      responses:
        '200':
          description: |-
            현재 로그인 세션을 무효화하고 refresh token 쿠키를 제거
            쿠키가 없거나 이미 만료된 경우에도 동일하게 성공 응답
            ```
            Set-Cookie: refreshToken=; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth; Max-Age=0
            Cache-Control: no-store
            ```
            프론트엔드는 메모리에 보관한 access token도 삭제
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    nullable: true
              example:
                success: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 허용되지 않은 요청 출처
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_ORIGIN:
                  summary: 허용되지 않은 요청 출처
                  value:
                    success: false
                    code: INVALID_ORIGIN
                    message: 허용되지 않은 요청
  /api/v1/auth/invitations/verify:
    post:
      tags:
        - AUTH · 인증 · 사용자
      summary: '[API-AUTH-004] 초대 링크 확인·연결 대상 조회'
      operationId: auth004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - invitationToken
              properties:
                invitationToken:
                  type: string
            example:
              invitationToken: '{invitationToken}'
      description: |-
        초대 링크 검증 · 연결 대상 이름, 학번 조회

        **API ID**: `API-AUTH-004` · **사용처**: FE-BE · **권한**: 공개 · **기능 명세서**: [F-AUTH-003](https://app.notion.com/p/F-AUTH-003-40b9f962b8af80ce991cd61a4bf6e013?pvs=21)
      security: []
      responses:
        '200':
          description: 조회만으로 초대 링크를 사용 처리하지 않음
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                      maskedStudentId:
                        type: string
              example:
                success: true
                data:
                  name: 홍길동
                  maskedStudentId: 2022****44
        '400':
          description: 필수값 누락·형식 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  summary: 필수값 누락·형식 오류
                  value:
                    success: false
                    code: VALIDATION_FAILED
                    message: 요청 형식이 올바르지 않습니다.
        '403':
          description: 비활성 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                USER_INACTIVE:
                  summary: 비활성 사용자
                  value:
                    success: false
                    code: USER_INACTIVE
                    message: 비활성화된 사용자. 운영진에게 문의해 주세요.
        '410':
          description: 만료·사용·무효 링크
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVITATION_UNAVAILABLE:
                  summary: 만료·사용·무효 링크
                  value:
                    success: false
                    code: INVITATION_UNAVAILABLE
                    message: 사용할 수 없는 초대 링크. 운영진에게 재발송을 요청해 주세요.
  /api/v1/auth/invitations/accept:
    post:
      tags:
        - AUTH · 인증 · 사용자
      summary: '[API-AUTH-005] Google 계정 연결·로그인'
      operationId: auth005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - invitationToken
                - idToken
              properties:
                invitationToken:
                  type: string
                idToken:
                  type: string
            example:
              invitationToken: '{invitationToken}'
              idToken: '{googleIdToken}'
      description: |-
        Google 계정 연결 후 로그인

        **API ID**: `API-AUTH-005` · **사용처**: FE-BE · **권한**: 공개 · **기능 명세서**: [F-AUTH-003](https://app.notion.com/p/F-AUTH-003-40b9f962b8af80ce991cd61a4bf6e013?pvs=21)
      security: []
      responses:
        '200':
          description: |-
            Google 계정 연결 성공 시 초대 링크를 사용 처리하고 로그인
            ```
            Set-Cookie: refreshToken={refreshToken}; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth; Max-Age=3600
            Cache-Control: no-store
            ```
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      tokenType:
                        type: string
                      expiresIn:
                        type: integer
                      sessionExpiresAt:
                        type: string
                        format: date-time
                      user:
                        type: object
                        properties:
                          userId:
                            type: string
                          name:
                            type: string
                          role:
                            type: string
              example:
                success: true
                data:
                  accessToken: '{accessToken}'
                  tokenType: Bearer
                  expiresIn: 900
                  sessionExpiresAt: '2026-11-08T16:00:00+09:00'
                  user:
                    userId: usr_001
                    name: 홍길동
                    role: GENERAL
        '400':
          description: 필수값 누락·형식 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  summary: 필수값 누락·형식 오류
                  value:
                    success: false
                    code: VALIDATION_FAILED
                    message: 요청 형식이 올바르지 않습니다.
        '401':
          description: Google ID 토큰 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_GOOGLE_TOKEN:
                  summary: Google ID 토큰 검증 실패
                  value:
                    success: false
                    code: INVALID_GOOGLE_TOKEN
                    message: Google 인증 확인 불가. 다시 로그인해 주세요.
        '403':
          description: |-
            - 비활성 사용자
            - 허용되지 않은 요청 출처
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                USER_INACTIVE:
                  summary: 비활성 사용자
                  value:
                    success: false
                    code: USER_INACTIVE
                    message: 비활성화된 사용자. 운영진에게 문의해 주세요.
                INVALID_ORIGIN:
                  summary: 허용되지 않은 요청 출처
                  value:
                    success: false
                    code: INVALID_ORIGIN
                    message: 허용되지 않은 요청
        '409':
          description: 다른 사용자에게 연결된 Google 계정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                GOOGLE_ACCOUNT_ALREADY_LINKED:
                  summary: 다른 사용자에게 연결된 Google 계정
                  value:
                    success: false
                    code: GOOGLE_ACCOUNT_ALREADY_LINKED
                    message: 이미 다른 계정에 연결된 Google 계정
        '410':
          description: 만료·사용·무효 링크
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVITATION_UNAVAILABLE:
                  summary: 만료·사용·무효 링크
                  value:
                    success: false
                    code: INVITATION_UNAVAILABLE
                    message: 사용할 수 없는 초대 링크. 운영진에게 재발송을 요청해 주세요.
  /api/v1/admin/users/{userId}/invitations:
    post:
      tags:
        - AUTH · 인증 · 사용자
      summary: '[API-AUTH-006] 초대 메일 재발송'
      operationId: auth006
      x-roles:
        - 운영진
      description: |-
        초대 메일 재발송

