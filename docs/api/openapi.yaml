  /api/v1/admin/recruitments/{rid}/mails:
    post:
      tags:
        - RCT · 모집
      summary: '[API-RCT-024] 결과 메일 미리보기 · 일괄 발송'
      operationId: rct024
      x-roles:
        - 운영진
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stage:
                  type: string
                  enum:
                    - DOCUMENT
                    - FINAL
                targets:
                  type: string
                dryRun:
                  type: boolean
            example:
              stage: DOCUMENT
              targets: ALL
              dryRun: true
      description: |-
        결과 메일 미리보기(dryRun) · 일괄 발송. 전형 확정이 선행 조건

        **API ID**: `API-RCT-024` · **사용처**: FE-BE · **권한**: 운영진 · **기능 명세서**: [F-RCT-008](https://app.notion.com/p/F-RCT-008-40b9f962b8af8092a65fe13382d84646?pvs=21)

        **상세 규칙**

        - `targets`: `"ALL"` 또는 `aid` 배열. 미리보기와 발송은 같은 제외 기준을 씁니다.
        - 제외: 결과 미정, 서류 합격인데 면접 일정 없음, 이미 발송 성공, 삭제됨.
        - `FINAL` 발송 조건은 **회원 등록 여부**(RCT-027의 `CREATED` · `ALREADY_MEMBER`)입니다. 초대 메일 성공 여부는 보지 않습니다.
        - 발송 당시 템플릿 버전을 작업에 고정합니다.
        - (선택) 일일 발송 한도: 미리보기에서 발송 대상 수가 Gmail 일일 한도(약 500명)를 넘으면 `quotaWarning`을 넣습니다. 지금 규모(약 120명)에서는 거의 걸리지 않습니다.
      parameters:
        - name: rid
          in: path
          required: true
          schema:
            type: string
      security:
        - accessToken: []
      responses:
        '200':
          description: '성공 — dryRun: true'
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      counts:
                        type: object
                        properties:
                          DOC_PASS:
                            type: integer
                          DOC_FAIL:
                            type: integer
                      excluded:
                        type: array
                        items:
                          type: object
                          properties:
                            aid:
                              type: string
                            reason:
                              type: string
                              enum:
                                - RESULT_PENDING
                                - INTERVIEW_NOT_SCHEDULED
                                - ALREADY_SENT
                                - DELETED
                      previews:
                        type: array
                        items:
                          type: object
                          properties:
                            templateKey:
                              type: string
                            subject:
                              type: string
                            body:
                              type: string
                      quotaWarning:
                        type: object
                        nullable: true
                        description: (선택) 발송 대상이 일일 한도를 넘을 때만. 아니면 `null` 또는 생략
                        properties:
                          total:
                            type: integer
                            description: 발송 대상 수
                          dailyLimit:
                            type: integer
                            description: 일일 발송 한도
              example:
                success: true
                data:
                  counts:
                    DOC_PASS: 40
                    DOC_FAIL: 79
                  excluded:
                    - aid: a_1b2c
                      reason: RESULT_PENDING
                  previews:
                    - templateKey: DOC_PASS
                      subject: '[GDGoC DGU] 홍길동님 서류 전형 결과 안내'
                      body: ...
        '202':
          description: '성공 — dryRun: false'
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      jobId:
                        type: string
                      total:
                        type: integer
                      excluded:
                        type: integer
              example:
                success: true
                data:
                  jobId: mj_01
                  total: 119
                  excluded: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 전형 미확정 / 최종 합격자 회원 등록 전
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                STAGE_NOT_CONFIRMED:
                  value:
                    success: false
                    code: STAGE_NOT_CONFIRMED
                    message: 전형 결과를 먼저 확정해주세요.
                MEMBERS_NOT_REGISTERED:
                  value:
                    success: false
                    code: MEMBERS_NOT_REGISTERED
                    message: 최종 합격자를 회원으로 먼저 등록해주세요.
