        게시판별 게시글을 최신순 10개씩 조회. 카테고리 · 모집 상태 · 검색어 필터. Community 전체 탭 + 검색어 없음이면 공지를 상단 고정

        **API ID**: `API-BRD-001` · **사용처**: FE-BE · **권한**: 공개 · **기능 명세서**: [F-BRD-001](https://app.notion.com/p/F-BRD-001-40b9f962b8af80cfa3c0e875556ad6f5?pvs=21), [F-BRD-008](https://app.notion.com/p/F-BRD-008-40b9f962b8af80b69c4bc3ddd7f68b91?pvs=21)

        **상세 규칙**

        - `pinned`는 Community + 전체 탭(category 없음) + 검색어 없음일 때만 채움. 그 외에는 빈 배열이고 공지도 `content`에 최신순으로 섞임.
        - 고정 공지는 페이지당 10개에 포함하지 않음. `totalElements`도 `content` 기준.
        - 관리자 글은 `authorName`이 '운영진'이고, 작성자 검색은 '운영진'으로만 걸림.
        - 삭제 상태 글은 제외. Teams 글만 `recruitStatus` · 기간 포함.
