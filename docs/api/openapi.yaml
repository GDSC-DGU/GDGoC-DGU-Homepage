  /api/v1/admin/dashboard:
    get:
      tags:
        - OPS · 운영
      summary: '[API-OPS-009] 관리자 대시보드 조회'
      operationId: ops009
      x-roles:
        - 운영진
      description: |-
        운영 현황 대시보드 조회

        **API ID**: `API-OPS-009` · **사용처**: FE-BE · **권한**: 운영진 · **기능 명세서**: [F-OPS-002](https://app.notion.com/p/F-OPS-002-40b9f962b8af80298f6ef410f4f11f74?pvs=21)
      security:
        - accessToken: []
      responses:
        '200':
          description: |-
            - 날짜 기준은 KST. 접속자 집계 방식은 F-OPS-003을 따름
            - 게시글·댓글은 Teams·Community를 합쳐 최신순으로 각각 최대 5개 반환
            - `board`는 `TEAMS` 또는 `COMMUNITY`. `postId`와 `commentId`는 C 게시판 API에서 사용하는 실제 숫자 ID를 반환
            - `recentComments[].postId`는 댓글이 달린 게시글의 ID. 프론트는 이 값으로 해당 글을 열 수 있음
            - 일정은 F-HOM-004와 같은 선정 기준으로, 가까운 일정부터 최대 4개 반환
            - 목록이 없으면 해당 배열은 `[]`, 집계 결과가 0건이면 `0`을 반환
            - `newPostCount`는 조회 시점 기준 최근 24시간 동안 등록된 게시글 수. `newCommentCount24h`는 같은 기간에 등록된 댓글 수
            - `visitors.today`와 `visitors.thisWeek`는 한국 시간(KST) 기준으로 각 기간 안에서 중복을 제거한 방문자 수
            - `visitors.thisWeek`는 이번 주 월요일 0시(KST)부터 조회 시점까지 중복을 제거한 방문자 수
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      stats:
                        type: object
                        properties:
                          visitors:
                            type: object
                            properties:
                              today:
                                type: integer
                              thisWeek:
                                type: integer
                          newPostCount:
                            type: integer
                          newCommentCount24h:
                            type: integer
                      recentPosts:
                        type: array
                        items:
                          type: object
                          properties:
                            postId:
                              type: integer
                            board:
                              type: string
                            title:
                              type: string
                            createdAt:
                              type: string
                              format: date-time
                      recentComments:
                        type: array
                        items:
                          type: object
                          properties:
                            commentId:
                              type: integer
                            postId:
                              type: integer
                            board:
                              type: string
                            content:
                              type: string
                            createdAt:
                              type: string
                              format: date-time
                      upcomingSchedules:
                        type: array
                        items:
                          type: object
                          properties:
                            scheduleId:
                              type: string
                            title:
                              type: string
                            startAt:
                              type: string
                              format: date-time
                            endAt:
                              type: string
                              format: date-time
              example:
                success: true
                data:
                  stats:
                    visitors:
                      today: 120
                      thisWeek: 450
                    newPostCount: 7
                    newCommentCount24h: 12
                  recentPosts:
                    - postId: 42
                      board: TEAMS
                      title: 프로젝트 팀원을 모집합니다.
                      createdAt: '2026-11-08T14:00:00+09:00'
                  recentComments:
                    - commentId: 7
                      postId: 42
                      board: TEAMS
                      content: 참여하고 싶어요.
                      createdAt: '2026-11-08T14:30:00+09:00'
                  upcomingSchedules:
                    - scheduleId: sch_001
                      title: 신입 멤버 면접
                      startAt: '2026-11-10T09:00:00+09:00'
                      endAt: '2026-11-10T18:00:00+09:00'
        '401':
          description: 로그인 정보 없음·만료·무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                AUTH_REQUIRED:
                  summary: 로그인 정보 없음·만료·무효
                  value:
                    success: false
                    code: AUTH_REQUIRED
                    message: 다시 로그인해 주세요.
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  summary: 권한 없음
                  value:
                    success: false
                    code: FORBIDDEN
                    message: 관리자 대시보드를 조회할 권한 없음
        '500':
          description: 대시보드 조회 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                DASHBOARD_LOAD_FAILED:
                  summary: 대시보드 조회 실패
                  value:
                    success: false
                    code: DASHBOARD_LOAD_FAILED
                    message: 대시보드 불러오기 실패. 잠시 후 다시 시도해 주세요.
