  /api/v1/recruitments/current:
    get:
      tags:
        - RCT · 모집
      summary: '[API-RCT-001] 현재 모집 안내 조회'
      operationId: rct001
      description: |-
        현재 모집 안내와 지원 가능 여부(`applyState` · `canApply`)

        **API ID**: `API-RCT-001` · **사용처**: FE-BE · **권한**: 공개 · **기능 명세서**: [F-RCT-001](https://app.notion.com/p/F-RCT-001-40b9f962b8af804d9919edb8608583d2?pvs=21)

        **상세 규칙**

        - 현재 회차 = `DRAFT`가 아닌 회차 중 지원 시작일이 가장 늦은 회차. 기간이 지나도 다음 회차가 생길 때까지 이 회차를 돌려줍니다.
        - 기간 외 · 폼 미게시 · 수동 마감은 404가 아니라 200 + `applyState`로 구분합니다. 404는 회차가 하나도 없을 때뿐입니다.
        - 포스터(`posterUrl`)는 OPS-008로 이 `rid`에 등록한 이미지입니다. 홈페이지 콘텐츠(OPS-001)도 같은 `rid`를 씁니다.

        **지원 가능 판단 (RCT-001 · 005 · 030이 같은 함수를 씁니다)** — 시각은 모두 KST(+09:00), 시작 · 종료 시각을 모두 포함합니다.

        | applyState | 조건 | canApply |
        | --- | --- | --- |
        | `NOT_PUBLISHED` | 지원폼 미게시, 또는 status가 `DRAFT` | false |
        | `BEFORE_START` | 현재 < applyStartAt | false |
        | `OPEN` | applyStartAt ≤ 현재 ≤ applyEndAt 이고 수동 마감 아님 | true |
        | `ENDED` | 현재 > applyEndAt | false |
        | `CLOSED_MANUALLY` | 운영진이 RCT-008로 마감 | false |
      security: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      rid:
                        type: string
                      cohort:
                        type: integer
                      title:
                        type: string
                      status:
                        type: string
                      applyStartAt:
                        type: string
                        format: date-time
                      applyEndAt:
                        type: string
                        format: date-time
                      tracks:
                        type: array
                        items:
                          type: string
                      noticeMarkdown:
                        type: string
                      applyState:
                        type: string
                      canApply:
                        type: boolean
                      formVersion:
                        type: integer
                      posterUrl:
                        type: string
              example:
                success: true
                data:
                  rid: rct_5
                  cohort: 5
                  title: GDGoC DGU 5기 멤버 모집
                  status: OPEN
                  applyStartAt: '2027-02-20T00:00:00+09:00'
                  applyEndAt: '2027-03-05T23:59:59+09:00'
                  tracks:
                    - BE
                    - FE
                    - AI
                    - Mobile
                  noticeMarkdown: 모집 안내 본문
                  applyState: OPEN
                  canApply: true
                  formVersion: 3
                  posterUrl: https://storage.googleapis.com/...
        '404':
          description: 공개된 모집 회차가 하나도 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NOT_FOUND:
                  value:
                    success: false
                    code: NOT_FOUND
                    message: 모집 정보가 없습니다.
  /api/v1/recruitments/{rid}/form:
    get:
      tags:
        - RCT · 모집
      summary: '[API-RCT-002] 지원폼 문항 조회'
      operationId: rct002
      description: |-
        게시된 버전의 지원폼 문항

        **API ID**: `API-RCT-002` · **사용처**: FE-BE · **권한**: 공개 · **기능 명세서**: [F-RCT-002](https://app.notion.com/p/F-RCT-002-40b9f962b8af80ddaae4d7b2dfc13e6c?pvs=21), [F-RCT-003](https://app.notion.com/p/F-RCT-003-40b9f962b8af80e29e7de92e30fc5da3?pvs=21)

        **상세 규칙**

        - 문항 타입: `SHORT_TEXT`(최대 100자) · `LONG_TEXT`(최대 1000자) · `SINGLE_CHOICE` · `MULTI_CHOICE` · `URL`(http · https, 최대 2048자).
        - 지원서는 파일을 받지 않습니다(11/10 결정). 포트폴리오 등은 `URL` 문항으로 받습니다.
        - `maxLength`는 저장(RCT-010) · 조회(RCT-002) · 제출 검증(RCT-005)에서 같은 값을 씁니다.
      parameters:
        - name: rid
          in: path
          required: true
          schema:
            type: string
      security: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      rid:
                        type: string
                      formVersion:
                        type: integer
                      questions:
                        type: array
                        items:
                          type: object
                          properties:
                            questionId:
                              type: string
                            type:
                              type: string
                              enum:
                                - SHORT_TEXT
                                - LONG_TEXT
                                - SINGLE_CHOICE
                                - MULTI_CHOICE
                                - URL
                            title:
                              type: string
                            description:
                              type: string
                            required:
                              type: boolean
                            maxLength:
                              type: integer
                            options:
                              type: array
                              items:
                                type: string
                            trackOnly:
                              type: array
                              items:
                                type: string
              example:
                success: true
                data:
                  rid: rct_5
                  formVersion: 3
                  questions:
                    - questionId: q1
                      type: SHORT_TEXT
                      title: 지원 동기를 적어주세요.
                      description: 1000자 이내
                      required: true
                      maxLength: 1000
                      options:
                        - string
                      trackOnly:
                        - BE
        '404':
          description: 회차 없음 또는 게시된 폼 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORM_NOT_PUBLISHED:
                  value:
                    success: false
                    code: FORM_NOT_PUBLISHED
                    message: 게시된 지원폼이 없습니다.
