        **API ID**: `API-BRD-002` · **사용처**: FE-BE · **권한**: 공개 · **기능 명세서**: [F-BRD-005](https://app.notion.com/p/F-BRD-005-40b9f962b8af8016b871fca31f180dd3?pvs=21)

