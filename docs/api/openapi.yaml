                    success: false
                    code: VALIDATION_FAILED
                    message: 요청 형식이 올바르지 않습니다.
        '401':
          description: 로그인 정보 없음·만료·무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                AUTH_REQUIRED:
                  summary: 로그인 정보 없음·만료·무효
                  value:
                    success: false
                    code: AUTH_REQUIRED
                    message: 다시 로그인해 주세요.
        '403':
          description: |-
            - 권한 없음
              운영진만 사용자의 활성 상태를 변경할 수 있음
            - 자기 자신 비활성화
          content:
            application/json:
              schema:
