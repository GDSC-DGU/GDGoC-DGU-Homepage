    delete:
      tags:
        - BRD · 게시판
      summary: '[API-BRD-013] 관리자 게시글 삭제 (행별 · 일괄)'
      operationId: brd013
      x-roles:
        - 운영진
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - postIds
              properties:
                postIds:
                  type: array
                  items:
                    type: integer
                  description: 1개 이상
            example:
              postIds:
                - 1
      description: |-
        선택한 게시글들을 삭제 상태로 변경. 댓글도 함께 숨김, 삭제한 관리자와 시각 기록

        **API ID**: `API-BRD-013` · **사용처**: FE-BE · **권한**: 운영진 · **기능 명세서**: [F-BRD-009](https://app.notion.com/p/F-BRD-009-40b9f962b8af80c082c5def49524fbff?pvs=21), [F-BRD-004](https://app.notion.com/p/F-BRD-004-40b9f962b8af801daef7c6bb2c0c1a49?pvs=21)

        **상세 규칙**

        - 행별 삭제도 같은 API에 1개만 담아 보냄.
        - 없거나 이미 삭제된 ID는 건너뛰고 실제 삭제된 개수만 `deletedCount`로 반환.
        - 삭제한 글이 SESSION · EVENT면 연결된 일정도 함께 제거
      security:
        - accessToken: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      deletedCount:
                        type: integer
              example:
                success: true
                data:
                  deletedCount: 3
        '400':
          description: postIds 비어 있음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  summary: postIds 비어 있음
                  value:
                    success: false
                    code: VALIDATION_ERROR
                    message: 삭제할 게시글을 선택해 주세요.
        '401':
          description: 토큰 없음, 만료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  summary: 토큰 없음, 만료
                  value:
                    success: false
                    code: UNAUTHORIZED
                    message: 로그인이 필요합니다.
        '403':
          description: 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  value:
                    success: false
                    code: FORBIDDEN
                    message: 접근 권한이 없습니다.
    post:
      tags:
        - BRD · 게시판
      summary: '[API-BRD-015] 관리자 게시글 작성'
      operationId: brd015
      x-roles:
        - 운영진
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - category
                - title
                - content
              properties:
                category:
                  type: string
                  enum:
                    - NOTICE
                    - SESSION
                    - EVENT
                    - INFO
                    - ETC
                title:
                  type: string
                content:
                  type: string
                  description: 일반 텍스트
                startDate:
                  type: string
                  format: date
                  description: SESSION · EVENT 필수, 나머지 선택
                endDate:
                  type: string
                  format: date
                  description: SESSION · EVENT 필수, startDate와 같거나 이후
                attachmentIds:
                  type: array
                  items:
                    type: integer
                  description: 최대 3개
            example:
              category: NOTICE
              title: string
              content: string
              startDate: '2026-11-20'
              endDate: '2026-11-20'
              attachmentIds:
                - 1
      description: |-
        운영진이 Community에 공지 · 세션 · 행사 등 게시. 화면에는 '운영진'으로 표시, 실제 계정은 내부 기록

        **API ID**: `API-BRD-015` · **사용처**: FE-BE · **권한**: 운영진 · **기능 명세서**: [F-BRD-010](https://app.notion.com/p/F-BRD-010-40b9f962b8af802ca4f2ec0119a1ea9a?pvs=21)

        **상세 규칙**

        - board는 항상 COMMUNITY라 받지 않음.
        - SESSION · EVENT 글을 등록하면 A의 일정(캘린더)을 자동 생성하고, 일정에 원본 postId를 저장.
        - NOTICE는 Community 목록 상단 고정 대상(API-BRD-001 `pinned`).
        - 게시 예약은 미정.
      security:
        - accessToken: []
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      postId:
                        type: integer
              example:
                success: true
                data:
                  postId: 5
        '400':
          description: |-
            - 필수값 누락 · 종료일이 시작일보다 이전
            - 세션 · 행사인데 기간 없음
            - 첨부 3개 초과 · 잘못된 첨부 ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  summary: 필수값 누락 · 종료일이 시작일보다 이전
                  value:
                    success: false
                    code: VALIDATION_ERROR
                    message: 필수 항목입니다.
                PERIOD_REQUIRED:
                  summary: 세션 · 행사인데 기간 없음
                  value:
                    success: false
                    code: PERIOD_REQUIRED
                    message: 세션 · 행사는 기간을 입력해 주세요.
                INVALID_ATTACHMENT:
                  summary: 첨부 3개 초과 · 잘못된 첨부 ID
                  value:
                    success: false
                    code: INVALID_ATTACHMENT
                    message: 파일은 최대 3개까지 첨부할 수 있어요.
        '401':
          description: 토큰 없음, 만료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  summary: 토큰 없음, 만료
                  value:
                    success: false
                    code: UNAUTHORIZED
                    message: 로그인이 필요합니다.
        '403':
          description: 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  value:
                    success: false
                    code: FORBIDDEN
                    message: 접근 권한이 없습니다.
