                  type: boolean
                  description: 개인정보 수집 · 이용 동의. 지원서 답변의 AI 채점 활용 동의를 포함합니다. `true`여야 제출됩니다.
                formVersion:
                  type: integer
            example:
              applicant:
                name: 홍길동
                studentId: '2023123456'
                major: 컴퓨터AI학부
                email: hong@dgu.ac.kr
                phone: 010-0000-0000
              track: BE
              answers:
                - questionId: q1
                  value: 지원 동기 답변
                - questionId: q4
                  value: https://github.com/hong
                - questionId: q5
                  values:
                    - BE
                    - AI
              privacyConsent: true
              formVersion: 3
      description: |-
        지원서 저장 + 채점 대기 등록 (트랜잭션, 학번 · 이메일 중복 방지)

        **API ID**: `API-RCT-005` · **사용처**: FE-BE · **권한**: 공개 · **기능 명세서**: [F-RCT-003](https://app.notion.com/p/F-RCT-003-40b9f962b8af80e29e7de92e30fc5da3?pvs=21), [F-RCT-004](https://app.notion.com/p/F-RCT-004-40b9f962b8af80118653c40c82230390?pvs=21)

        **상세 규칙**

        - 접수 조건은 RCT-001의 `applyState == OPEN`과 같은 함수로 판단합니다. 프론트의 `canApply`와 서버 판단이 어긋나지 않습니다.
        - 같은 회차에서 **학번 또는 이메일**이 같으면 중복입니다. 이메일은 소문자 · 공백 제거 후 비교합니다.
        - 중복 키 문서(학번 해시 · 이메일 해시)를 지원서와 같은 트랜잭션에서 만들어 동시 제출도 막습니다.
        - 단일 · 주관식 · URL 문항은 `value`, 복수 선택은 `values`로 보냅니다. `URL`은 http · https만 허용합니다.
        - 저장 후 Cloud Tasks에 채점 작업(RCT-028)을 등록합니다. 등록에 실패해도 RCT-031이 다시 넣습니다.
      parameters:
