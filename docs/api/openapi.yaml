                            isActive:
                              type: boolean
                            googleConnected:
                              type: boolean
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                          pageSize:
                            type: integer
                          totalCount:
                            type: integer
                          totalPages:
                            type: integer
              example:
                success: true
                data:
                  users:
                    - userId: usr_001
                      name: 홍길동
                      maskedStudentId: 2022****44
                      email: member@example.com
                      googleEmail: member@gmail.com
                      role: GENERAL
                      cohort: 5
                      isActive: true
                      googleConnected: true
                  pagination:
                    page: 1
                    pageSize: 20
                    totalCount: 1
                    totalPages: 1
