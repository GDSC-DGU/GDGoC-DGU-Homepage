      description: |-
        사용자 일괄 비활성화, 재활성화

        **API ID**: `API-AUTH-012` · **사용처**: FE-BE · **권한**: 운영진 · **기능 명세서**: [F-AUTH-008](https://app.notion.com/p/F-AUTH-008-40b9f962b8af8049b4aed6a69b7e3f44?pvs=21)

        **상세 규칙**

        `isActive`: 비활성화는 `false`, 재활성화는 `true`
        - 두 항목 모두 필수이며 사용자를 1명 이상 지정해야 함
      security:
