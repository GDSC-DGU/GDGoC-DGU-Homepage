        - 업로드 직후에는 미연결 상태. 24시간 안에 게시글에 연결 안 되면 F-OPS-005 배치가 삭제.
        - 게시글당 3개 제한은 업로드가 아니라 작성 · 수정 API에서 검사.
        - 회원 토큰, 관리자 토큰 둘 다 받음 (관리자 게시글). 권한 옵션에 '회원'이 없으면 팀 노션에 추가 필요.
        - 용량 · 개수는 미정 사항이라 확정되면 숫자만 변경.
      security:
        - accessToken: []
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      fileId:
                        type: integer
                      fileName:
                        type: string
                      size:
                        type: integer
              example:
                success: true
                data:
                  fileId: 31
                  fileName: 모집안내.pdf
                  size: 204800
        '400':
          description: 형식, 용량 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_FILE:
                  summary: 형식, 용량 오류
                  value:
                    success: false
                    code: INVALID_FILE
                    message: PDF · JPG · PNG 파일만, 10MB 이하로 올릴 수 있어요.
        '401':
          description: 토큰 없음, 만료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  summary: 토큰 없음, 만료
                  value:
                    success: false
                    code: UNAUTHORIZED
                    message: 로그인이 필요합니다.
  /api/v1/files/{fileId}/download:
    get:
      tags:
        - BRD · 게시판
      summary: '[API-BRD-010] 첨부파일 다운로드 주소 발급'
      operationId: brd010
      description: |-
        파일명을 누르면 짧은 시간만 유효한 다운로드 주소를 발급. 비회원도 가능

        **API ID**: `API-BRD-010` · **사용처**: FE-BE · **권한**: 공개 · **기능 명세서**: [F-BRD-007](https://app.notion.com/p/F-BRD-007-40b9f962b8af8023b3baeb0c121086f6?pvs=21)

        **상세 규칙**

        - 주소 유효 시간은 미정 (예: 5분). FE는 받은 `downloadUrl`로 바로 이동.
        - 파일 저장소(GCS · S3 등) 서명 URL을 쓰면 저장소 호출 부분은 BE-EX 성격.
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: integer
      security: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      downloadUrl:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
              example:
                success: true
                data:
                  downloadUrl: https://storage.example.com/files/31?signature=...
                  expiresAt: '2026-11-08T18:35:00+09:00'
        '404':
          description: 없는 파일 · 게시글에 연결 안 된 파일 · 삭제된 글의 파일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FILE_NOT_FOUND:
                  summary: 없는 파일 · 게시글에 연결 안 된 파일 · 삭제된 글의 파일
                  value:
                    success: false
                    code: FILE_NOT_FOUND
                    message: 파일을 찾을 수 없습니다.
  /api/v1/admin/posts:
